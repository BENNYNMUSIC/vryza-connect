<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vryza Connect - Chat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.IO Client -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- Emoji Picker Element CDN Module -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans overflow-hidden">

  <!-- Header -->
  <header class="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-bold text-blue-600">Vryza Connect</h1>
    </div>
    <div class="flex items-center gap-2">
      <button id="startCall" class="bg-green-600 hover:bg-green-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition flex items-center gap-1">
        🎥 Start Call
      </button>
      <button id="endCall" class="bg-red-600 hover:bg-red-700 text-white px-3 py-1.5 rounded-lg text-xs font-semibold transition hidden flex items-center gap-1">
        🛑 End Call
      </button>
    </div>
  </header>

  <!-- WebRTC Video Call Area -->
  <div id="videoArea" class="hidden relative bg-slate-900 w-full h-64 shrink-0 p-2 flex gap-2">
    <video id="remoteVideo" autoplay playsinline class="w-1/2 h-full object-cover rounded-xl bg-black border border-slate-700"></video>
    <video id="localVideo" autoplay playsinline muted class="w-1/2 h-full object-cover rounded-xl bg-black border border-slate-700"></video>
  </div>

  <!-- Main Grid Layout -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Contacts Sidebar -->
    <aside id="contactsAside" class="w-full md:w-80 bg-white border-r border-slate-200 flex flex-col shrink-0">
      <div class="p-4 border-b border-slate-100">
        <input id="searchUser" type="text" placeholder="Search users..." class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-500" />
      </div>
      <div id="onlineUsers" class="flex-1 overflow-y-auto p-3 space-y-1">
        <!-- Dynamically Populated Conversations -->
      </div>
    </aside>

    <!-- Chat Area -->
    <main id="chatSection" class="hidden md:flex flex-1 flex-col bg-slate-50 relative">

      <!-- Empty State -->
      <div id="emptyChat" class="flex-1 flex flex-col items-center justify-center text-slate-400 text-sm">
        💬 Select a conversation from the sidebar to start chatting
      </div>

      <!-- Active Chat Window -->
      <div class="flex-1 flex flex-col h-full min-h-0">
        
        <!-- Active Chat Header -->
        <div class="px-6 py-3 bg-white border-b border-slate-200 flex items-center justify-between shrink-0">
          <div>
            <h2 id="chatWith" class="font-bold text-slate-800 text-sm">Select target user</h2>
            <span id="typing" class="text-xs text-blue-500 italic h-4 block"></span>
          </div>
          <button onclick="showContactsView()" class="md:hidden text-xs text-blue-600 font-semibold">
            ← Back
          </button>
        </div>

        <!-- Messages History Window -->
        <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-3">
          <!-- Messages will render here -->
        </div>

        <!-- Chat Controls & Input Bar -->
        <div class="relative bg-white border-t border-slate-200 p-3 flex items-center gap-2 shrink-0">
          
          <!-- Emoji Picker Popover Modal -->
          <div id="emojiPickerContainer" class="hidden absolute bottom-16 left-3 z-50 shadow-2xl border border-slate-200 rounded-2xl bg-white p-1"></div>

          <!-- Emoji Picker Toggle Button -->
          <button id="emojiBtn" type="button" title="Insert Emoji" class="p-2 text-slate-500 hover:text-slate-700 transition rounded-full hover:bg-slate-100 text-lg">
            😀
          </button>

          <!-- Attachment Button -->
          <button id="attachBtn" type="button" title="Attach Media" class="p-2 text-slate-500 hover:text-slate-700 transition rounded-full hover:bg-slate-100 text-lg">
            📎
          </button>
          <input id="mediaInput" type="file" accept="image/*,video/*" class="hidden" />

          <!-- Text Input -->
          <input id="message" type="text" placeholder="Type a message..." class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-full text-sm outline-none focus:border-blue-500" />

          <!-- Voice Recording Button -->
          <button id="micBtn" type="button" onclick="toggleRecording()" title="Record Voice Note" class="p-2.5 text-slate-500 hover:text-slate-700 transition rounded-full hover:bg-slate-100">
            🎙️
          </button>

          <!-- Send Text Message Button -->
          <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white p-2.5 rounded-full transition shrink-0 flex items-center justify-center">
            ➔
          </button>
        </div>

      </div>
    </main>
  </div>

  <script src="chat.js"></script>
</body>
</html>
