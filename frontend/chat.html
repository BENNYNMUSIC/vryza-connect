<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />

  <title>Vryza+ Chat</title>

  <link
    rel="shortcut icon"
    href="images/vryza connect.png"
    type="image/x-icon"
  />

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      font-family: "Inter", sans-serif;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 20px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    video {
      border-radius: 12px;
    }
  </style>
</head>


<body
  class="bg-slate-100 h-[100dvh] w-screen overflow-hidden flex flex-col"
>


  <!-- ========================================================= -->
  <!-- NAVBAR -->
  <!-- ========================================================= -->

  <nav
    class="shrink-0 bg-white/90 backdrop-blur-md border-b border-slate-200 shadow-sm z-40"
  >

    <div
      class="max-w-7xl mx-auto px-4 sm:px-6 py-2.5 flex items-center justify-between"
    >

      <!-- LOGO -->
      <div class="flex items-center gap-2 sm:gap-3">

        <div
          class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-1.5 sm:p-2 rounded-xl shadow-md"
        >

          <img
            src="images/vryza connect.png"
            class="w-5 h-5 sm:w-6 sm:h-6 invert brightness-200"
            alt="Vryza+ logo"
          />

        </div>

        <h1
          class="text-xl sm:text-2xl font-black tracking-tight text-slate-800"
        >
          Vryza<span class="text-blue-600">+</span>
        </h1>

      </div>


      <!-- NAVIGATION -->
      <div
        class="flex items-center gap-3 sm:gap-6 text-xs sm:text-sm"
      >

        <!-- HOME -->
        <button
          type="button"
          onclick="go('home.html')"
          class="text-slate-500 hover:text-blue-600 font-semibold transition"
        >
          Home
        </button>


        <!-- PROFILE -->
        <button
          type="button"
          onclick="go('profile.html')"
          class="text-slate-500 hover:text-blue-600 font-semibold transition hidden xs:inline"
        >
          Profile
        </button>


        <!-- ===================================================== -->
        <!-- CHAT BUTTON + UNREAD BADGE -->
        <!-- ===================================================== -->

        <button
          type="button"
          onclick="go('chat.html')"
          class="relative text-blue-600 font-bold flex items-center gap-1.5"
          aria-label="Chat"
        >

          <span>💬 Chat</span>


          <!-- UNREAD MESSAGE BADGE -->
          <span
            id="chatUnreadBadge"
            class="
              hidden
              absolute
              -top-2
              -right-3
              min-w-[20px]
              h-5
              px-1.5
              rounded-full
              bg-red-500
              text-white
              text-[10px]
              font-black
              flex
              items-center
              justify-center
              text-center
              shadow-md
              border-2
              border-white
              leading-none
            "
          >
            0
          </span>


          <!-- ACTIVE NAV INDICATOR -->
          <span
            class="absolute -bottom-1 left-0 w-full h-0.5 bg-blue-600 rounded-full"
          ></span>

        </button>


        <!-- LOGOUT -->
        <button
          type="button"
          onclick="logout()"
          class="
            bg-red-500
            hover:bg-red-600
            text-white
            px-3
            py-1.5
            sm:px-4
            sm:py-2
            rounded-xl
            font-semibold
            transition
          "
        >
          Logout
        </button>

      </div>

    </div>

  </nav>



  <!-- ========================================================= -->
  <!-- MAIN CHAT INTERFACE -->
  <!-- ========================================================= -->

  <main
    class="flex-1 max-w-7xl w-full mx-auto p-2 sm:p-4 md:p-6 overflow-hidden"
  >

    <div
      class="grid grid-cols-1 md:grid-cols-12 gap-3 sm:gap-5 h-full"
    >


      <!-- ======================================================= -->
      <!-- CONTACTS ASIDE -->
      <!-- ======================================================= -->

      <aside
        id="contactsAside"
        class="
          md:col-span-4
          bg-white
          rounded-2xl
          sm:rounded-3xl
          border
          border-slate-200
          shadow-sm
          overflow-hidden
          flex
          flex-col
          h-full
        "
      >


        <!-- CONTACT HEADER -->
        <div
          class="p-3 sm:p-5 border-b border-slate-100 flex items-center justify-between"
        >

          <h2
            class="font-bold text-slate-800 text-base sm:text-lg"
          >
            Contacts
          </h2>


          <span
            class="
              bg-green-100
              text-green-600
              text-[10px]
              uppercase
              tracking-widest
              px-2
              py-0.5
              sm:py-1
              rounded-full
              font-bold
            "
          >
            Live
          </span>

        </div>


        <!-- SEARCH -->
        <div
          class="p-3 sm:p-4 border-b border-slate-100"
        >

          <input
            type="text"
            id="searchUser"
            placeholder="Search users..."
            autocomplete="off"
            class="
              w-full
              bg-slate-100
              px-3
              sm:px-4
              py-2.5
              rounded-xl
              sm:rounded-2xl
              outline-none
              text-xs
              sm:text-sm
              focus:ring-2
              focus:ring-blue-200
              transition-all
            "
          />

        </div>


        <!-- CONTACT LIST -->
        <div
          id="onlineUsers"
          class="
            flex-1
            overflow-y-auto
            p-3
            sm:p-4
            flex
            flex-col
            gap-2.5
          "
        >
        </div>

      </aside>



      <!-- ======================================================= -->
      <!-- CHAT SECTION -->
      <!-- ======================================================= -->

      <section
        id="chatSection"
        class="
          hidden
          md:flex
          md:col-span-8
          bg-white
          rounded-2xl
          sm:rounded-3xl
          border
          border-slate-200
          shadow-sm
          overflow-hidden
          flex-col
          h-full
        "
      >


        <!-- ===================================================== -->
        <!-- CHAT HEADER -->
        <!-- ===================================================== -->

        <div
          class="
            px-3
            sm:px-5
            py-3
            border-b
            border-slate-100
            bg-slate-50
            flex
            items-center
            justify-between
            shrink-0
          "
        >

          <div
            class="flex items-center gap-2 overflow-hidden"
          >

            <!-- MOBILE BACK BUTTON -->
            <button
              type="button"
              id="backToContacts"
              onclick="showContactsView()"
              class="
                md:hidden
                text-slate-600
                hover:text-blue-600
                font-bold
                p-1
                text-xl
              "
              aria-label="Back to contacts"
            >
              ←
            </button>


            <div class="truncate">

              <h2
                id="chatWith"
                class="
                  font-bold
                  text-slate-700
                  text-sm
                  sm:text-lg
                  truncate
                "
              >
                Select a conversation
              </h2>


              <p
                id="typing"
                class="
                  text-[11px]
                  sm:text-xs
                  text-blue-500
                  min-h-[14px]
                  leading-tight
                "
              ></p>

            </div>

          </div>



          <!-- CHAT ACTION BUTTONS -->

          <div
            class="
              flex
              items-center
              gap-1.5
              sm:gap-2
              shrink-0
            "
          >


            <!-- START CALL -->
            <button
              type="button"
              id="startCall"
              class="
                bg-green-500
                hover:bg-green-600
                text-white
                px-3
                py-1.5
                sm:px-4
                sm:py-2
                rounded-xl
                text-xs
                sm:text-sm
                font-semibold
                transition
                flex
                items-center
                gap-1
              "
            >
              📞
              <span class="hidden xs:inline">
                Call
              </span>
            </button>


            <!-- END CALL -->
            <button
              type="button"
              id="endCall"
              class="
                hidden
                bg-red-600
                hover:bg-red-700
                text-white
                px-3
                py-1.5
                sm:px-4
                sm:py-2
                rounded-xl
                text-xs
                sm:text-sm
                font-semibold
                transition
                flex
                items-center
                gap-1
                animate-pulse
              "
            >
              🛑
              <span class="hidden xs:inline">
                End
              </span>
            </button>


            <!-- MEDIA BUTTON -->
            <label
              for="mediaInput"
              class="
                cursor-pointer
                flex
                items-center
                gap-1
                bg-blue-50
                hover:bg-blue-100
                text-blue-600
                px-3
                py-1.5
                sm:px-4
                sm:py-2
                rounded-xl
                text-xs
                sm:text-sm
                font-semibold
                transition
              "
            >
              📎
              <span class="hidden xs:inline">
                Media
              </span>
            </label>


            <!-- MEDIA INPUT -->
            <input
              type="file"
              id="mediaInput"
              class="hidden"
              accept="image/*,video/*"
            />

          </div>

        </div>



        <!-- ===================================================== -->
        <!-- VIDEO CALL AREA -->
        <!-- ===================================================== -->

        <div
          id="videoArea"
          class="
            hidden
            relative
            p-2
            sm:p-4
            border-b
            border-slate-200
            bg-slate-900
            grid
            grid-cols-2
            gap-2
            sm:gap-4
            shrink-0
            transition-all
          "
        >

          <!-- LOCAL VIDEO -->
          <div class="relative">

            <video
              id="localVideo"
              autoplay
              muted
              playsinline
              class="
                w-full
                h-32
                sm:h-48
                object-cover
                bg-slate-950
                border
                border-slate-800
                shadow-md
              "
            ></video>


            <span
              class="
                absolute
                bottom-2
                left-2
                bg-black/60
                backdrop-blur-sm
                text-[10px]
                sm:text-[11px]
                text-white
                px-2
                py-0.5
                rounded
                font-medium
              "
            >
              You
            </span>

          </div>


          <!-- REMOTE VIDEO -->
          <div class="relative">

            <video
              id="remoteVideo"
              autoplay
              playsinline
              class="
                w-full
                h-32
                sm:h-48
                object-cover
                bg-slate-950
                border
                border-slate-800
                shadow-md
              "
            ></video>


            <span
              class="
                absolute
                bottom-2
                left-2
                bg-black/60
                backdrop-blur-sm
                text-[10px]
                sm:text-[11px]
                text-white
                px-2
                py-0.5
                rounded
                font-medium
              "
            >
              Peer Stream
            </span>

          </div>


          <!-- MOBILE HANGUP BUTTON -->
          <button
            type="button"
            onclick="triggerEndCall()"
            class="
              absolute
              bottom-4
              left-1/2
              -translate-x-1/2
              bg-red-600
              text-white
              p-2.5
              rounded-full
              shadow-lg
              hover:bg-red-700
              transition
              z-10
              text-xs
              font-bold
              flex
              items-center
              gap-1
            "
          >
            🛑 Hang Up
          </button>

        </div>



        <!-- ===================================================== -->
        <!-- MESSAGES FEED -->
        <!-- ===================================================== -->

        <div
          id="messages"
          class="
            flex-1
            overflow-y-auto
            p-3
            sm:p-6
            bg-slate-50
            space-y-3
            sm:space-y-4
          "
        >

          <div
            id="emptyChat"
            class="
              text-center
              text-slate-400
              text-xs
              sm:text-sm
              mt-10
              italic
            "
          >
            Select a contact to start chatting
          </div>

        </div>



        <!-- ===================================================== -->
        <!-- INPUT BAR -->
        <!-- ===================================================== -->

        <div
          class="
            border-t
            border-slate-100
            bg-white
            p-2
            sm:p-4
            shrink-0
          "
        >

          <div
            class="
              flex
              items-center
              gap-1.5
              sm:gap-2
              bg-slate-100
              rounded-xl
              sm:rounded-2xl
              p-1.5
              sm:p-2
              focus-within:ring-2
              focus-within:ring-blue-500/20
              transition-all
            "
          >

            <!-- MESSAGE INPUT -->
            <input
              id="message"
              type="text"
              placeholder="Type a message..."
              autocomplete="off"
              class="
                flex-1
                bg-transparent
                border-none
                outline-none
                px-2
                sm:px-4
                py-1.5
                sm:py-2
                text-xs
                sm:text-sm
                text-slate-700
              "
            />


            <!-- MICROPHONE -->
            <button
              type="button"
              onclick="toggleRecording()"
              id="micBtn"
              class="
                w-9
                h-9
                sm:w-11
                sm:h-11
                rounded-xl
                bg-white
                hover:bg-red-50
                hover:text-red-500
                text-slate-500
                transition
                shadow-sm
                flex
                items-center
                justify-center
                text-sm
                sm:text-lg
                shrink-0
              "
              aria-label="Record voice note"
            >
              🎙️
            </button>


            <!-- SEND -->
            <button
              type="button"
              onclick="sendMessage()"
              class="
                bg-blue-600
                hover:bg-blue-700
                text-white
                px-3
                sm:px-5
                py-2
                sm:py-3
                rounded-xl
                text-xs
                sm:text-sm
                font-bold
                shadow-md
                shadow-blue-100
                transition
                shrink-0
              "
            >
              Send
            </button>

          </div>

        </div>

      </section>

    </div>

  </main>



  <!-- ========================================================= -->
  <!-- SOCKET.IO -->
  <!-- ========================================================= -->

  <script
    src="https://vryza-connect-backend-1.onrender.com/socket.io/socket.io.js"
    defer
  ></script>


  <!-- ========================================================= -->
  <!-- CHAT SCRIPT -->
  <!-- ========================================================= -->

  <script
    src="chat.js"
    defer
  ></script>


  <!-- ========================================================= -->
  <!-- UNREAD BADGE SCRIPT -->
  <!-- ========================================================= -->

  <script
    src="chatBadge.js"
    defer
  ></script>



  <!-- ========================================================= -->
  <!-- PAGE FUNCTIONS -->
  <!-- ========================================================= -->

  <script>

    function go(page) {
      if (!page) return;

      window.location.href = page;
    }


    function logout() {

      localStorage.removeItem("token");
      localStorage.removeItem("user");

      localStorage.removeItem("chatUserId");
      localStorage.removeItem("chatUsername");
      localStorage.removeItem("activeChatUser");

      window.location.href = "auth.html";
    }

  </script>


</body>
</html>
