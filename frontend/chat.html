<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vryza Connect - Chat</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Socket.IO Client -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <!-- Emoji Picker Element CDN Module -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@1/index.js"></script>
</head>
<body class="bg-slate-50 h-screen flex flex-col font-sans overflow-hidden antialiased text-slate-800">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-slate-200 px-6 py-3.5 flex items-center justify-between shrink-0 z-20 shadow-xs">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center text-white font-bold shadow-sm shadow-blue-500/30">
        V
      </div>
      <div>
        <h1 class="text-base font-bold text-slate-900 tracking-tight">Vryza Connect</h1>
        <p class="text-[11px] text-slate-400 font-medium leading-none">Secure Real-time Messaging</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <button id="startCall" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition shadow-sm shadow-emerald-600/20 flex items-center gap-1.5 cursor-pointer">
        <span>🎥</span> Start Call
      </button>
      <button id="endCall" class="bg-rose-600 hover:bg-rose-700 text-white px-3.5 py-2 rounded-xl text-xs font-semibold transition shadow-sm shadow-rose-600/20 hidden flex items-center gap-1.5 cursor-pointer">
        <span>🛑</span> End Call
      </button>
    </div>
  </header>

  <!-- WebRTC Video Call Area -->
  <div id="videoArea" class="hidden relative bg-slate-950 w-full h-72 shrink-0 p-3 gap-3 flex border-b border-slate-800 shadow-inner">
    <div class="relative w-1/2 h-full rounded-2xl overflow-hidden border border-slate-800 bg-black">
      <video id="remoteVideo" autoplay playsinline class="w-full h-full object-cover"></video>
      <span class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md text-white text-[11px] px-2.5 py-1 rounded-lg font-medium">Remote Participant</span>
    </div>
    <div class="relative w-1/2 h-full rounded-2xl overflow-hidden border border-slate-800 bg-black">
      <video id="localVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
      <span class="absolute bottom-3 left-3 bg-black/60 backdrop-blur-md text-white text-[11px] px-2.5 py-1 rounded-lg font-medium">You</span>
    </div>
  </div>

  <!-- Main Grid Layout -->
  <div class="flex-1 flex overflow-hidden">

    <!-- Contacts Sidebar -->
    <aside id="contactsAside" class="w-full md:w-88 bg-white border-r border-slate-200 flex flex-col shrink-0">
      <div class="p-4 border-b border-slate-100 bg-slate-50/50">
        <div class="relative">
          <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400 text-sm">🔍</span>
          <input id="searchUser" type="text" placeholder="Search conversations or users..." class="w-full pl-10 pr-4 py-2.5 bg-white border border-slate-200 rounded-xl text-xs outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/10 transition shadow-2xs" />
        </div>
      </div>
      <div id="onlineUsers" class="flex-1 overflow-y-auto p-3 space-y-1.5 scrollbar-thin">
        <!-- Dynamically Populated Conversations -->
      </div>
    </aside>

    <!-- Chat Area -->
    <main id="chatSection" class="hidden md:flex flex-1 flex-col bg-slate-100/60 relative">

      <!-- Empty State -->
      <div id="emptyChat" class="flex-1 flex flex-col items-center justify-center text-slate-400 text-sm p-6 text-center">
        <div class="w-16 h-16 rounded-2xl bg-white shadow-sm border border-slate-200 flex items-center justify-center text-2xl mb-3">💬</div>
        <p class="font-semibold text-slate-700">No chat selected</p>
        <p class="text-xs text-slate-400 mt-1 max-w-xs">Select a conversation from the sidebar or search for a user to start messaging.</p>
      </div>

      <!-- Active Chat Window -->
      <div class="flex-1 flex flex-col h-full min-h-0">
        
        <!-- Active Chat Header -->
        <div class="px-6 py-3.5 bg-white border-b border-slate-200 flex items-center justify-between shrink-0 shadow-2xs">
          <div class="flex items-center gap-3">
            <div>
              <h2 id="chatWith" class="font-bold text-slate-900 text-sm tracking-tight">Select target user</h2>
              <span id="typing" class="text-[11px] text-blue-600 font-medium italic h-4 block"></span>
            </div>
          </div>
          <button onclick="showContactsView()" class="md:hidden text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3 py-1.5 rounded-lg transition">
            ← Back to Chats
          </button>
        </div>

        <!-- Messages History Window -->
        <div id="messages" class="flex-1 overflow-y-auto p-6 space-y-4 scrollbar-thin">
          <!-- Messages will render here -->
        </div>

        <!-- Chat Controls & Input Bar -->
        <div class="relative bg-white border-t border-slate-200 p-3.5 flex items-center gap-2 shrink-0 shadow-sm">
          
          <!-- Emoji Picker Popover Modal -->
          <div id="emojiPickerContainer" class="hidden absolute bottom-20 left-4 z-50 shadow-xl border border-slate-200 rounded-2xl bg-white p-1"></div>

          <!-- Emoji Picker Toggle Button -->
          <button id="emojiBtn" type="button" title="Insert Emoji" class="p-2.5 text-slate-500 hover:text-blue-600 transition rounded-xl hover:bg-slate-100 text-lg cursor-pointer">
            😀
          </button>

          <!-- Attachment Button -->
          <button id="attachBtn" type="button" title="Attach Media" class="p-2.5 text-slate-500 hover:text-blue-600 transition rounded-xl hover:bg-slate-100 text-lg cursor-pointer">
            📎
          </button>
          <input id="mediaInput" type="file" accept="image/*,video/*" class="hidden" />

          <!-- Text Input -->
          <input id="message" type="text" placeholder="Type your message..." class="flex-1 px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs md:text-sm outline-none focus:border-blue-500 focus:bg-white focus:ring-2 focus:ring-blue-500/10 transition" />

          <!-- Voice Recording Button -->
          <button id="micBtn" type="button" onclick="toggleRecording()" title="Record Voice Note" class="p-2.5 text-slate-500 hover:text-rose-600 transition rounded-xl hover:bg-slate-100 cursor-pointer text-base">
            🎙️
          </button>

          <!-- Send Text Message Button -->
          <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white w-10 h-10 rounded-xl transition shrink-0 flex items-center justify-center shadow-md shadow-blue-600/20 cursor-pointer">
            <svg class="w-4 h-4 translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 12h14M12 5l7 7-7 7"/></svg>
          </button>
        </div>

      </div>
    </main>
  </div>

  <script src="chat.js"></script>
</body>
</html>
