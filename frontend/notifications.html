<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications - Vryza+</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #0f172a;
    color: #f8fafc;
    margin: 0;
    padding: 16px;
    max-width: 600px;
    margin-left: auto;
    margin-right: auto;
}

.header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    border-bottom: 1px solid #1e293b;
    padding-bottom: 12px;
}

h2 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 800;
}

.badge-box {
    background: #1e293b;
    border: 1px solid #334155;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
}

#notificationBadge {
    background: #ef4444;
    color: white;
    border-radius: 12px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 800;
}

.actions-bar {
    margin-bottom: 16px;
}

#markAllBtn {
    background: #334155;
    color: #f8fafc;
    border: none;
    padding: 8px 14px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
}

#markAllBtn:hover {
    background: #475569;
}

.notification {
    background: #1e293b;
    padding: 14px 16px;
    border-radius: 14px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: all 0.2s ease;
    border: 1px solid rgba(255, 255, 255, 0.05);
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.notification:hover {
    background: #334155;
}

.notification.unread {
    border-left: 4px solid #38bdf8;
    background: #0f172a;
    border-top: 1px solid #1e293b;
    border-right: 1px solid #1e293b;
    border-bottom: 1px solid #1e293b;
}

.notification.missed-call {
    border-left: 4px solid #ef4444;
}

.notification.incoming-call {
    border-left: 4px solid #22c55e;
}

.noti-content {
    display: flex;
    align-items: center;
    gap: 12px;
}

.noti-icon {
    font-size: 20px;
}

.noti-text {
    font-size: 14px;
    line-height: 1.4;
}

.time {
    color: #94a3b8;
    font-size: 11px;
    margin-top: 4px;
}

.toast {
    position: fixed;
    top: 20px;
    right: 20px;
    background: #0284c7;
    color: white;
    padding: 12px 18px;
    border-radius: 12px;
    z-index: 9999;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideIn 0.3s ease;
}

@keyframes slideIn {
    from { transform: translateY(-20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}
</style>
</head>
<body>

<div class="header-container">
    <h2>Notifications</h2>
    <div class="badge-box">
        🔔 Unread: <span id="notificationBadge">0</span>
    </div>
</div>

<div class="actions-bar">
    <button id="markAllBtn">Mark All As Read</button>
</div>

<div id="notifications"></div>

<!-- Absolute Socket.IO Client Script URL -->
<script src="https://vryza-connect-backend-1.onrender.com/socket.io/socket.io.js"></script>

<script>
const API_URL = "https://vryza-connect-backend-1.onrender.com";
const rawToken = localStorage.getItem("token");

if (!rawToken) {
    window.location.href = "auth.html";
}

const token = rawToken ? rawToken.replace(/^Bearer\s+/i, "").trim() : "";

let currentUserId = "";
if (token) {
    try {
        const base64Url = token.split('.')[1];
        const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
        const payload = JSON.parse(window.atob(base64));
        currentUserId = payload.id || payload._id; 
    } catch (e) {
        console.error("Failed to parse token payload", e);
    }
}

let page = 1;
let loading = false;
let hasMore = true;

// 1. Load Notifications from API
async function loadNotifications(pageNumber = 1) {
    if (loading || (!hasMore && pageNumber > 1)) return;
    loading = true;

    try {
        const res = await fetch(`${API_URL}/api/notifications?page=${pageNumber}`, {
            headers: {
                Authorization: `Bearer ${token}`
            }
        });

        const data = await res.json();
        const container = document.getElementById("notifications");
        
        if (pageNumber === 1) {
            container.innerHTML = "";
            hasMore = true;
        }

        const notificationList = data.notifications || (Array.isArray(data) ? data : []);

        if (!notificationList || !notificationList.length) {
            hasMore = false;
            if (pageNumber === 1) {
                container.innerHTML = "<p style='color: #64748b; text-align: center; margin-top: 40px;'>No notifications yet.</p>";
            }
            loading = false;
            return;
        }

        notificationList.forEach(notification => {
            let text = "";
            let icon = "🔔";
            let extraClass = "";
            const username = notification.from?.username || "Someone";

            switch(notification.type) {
                case "follow":
                    icon = "👤";
                    text = `<strong>${username}</strong> started following you`;
                    break;
                case "like":
                    icon = "❤️";
                    text = `<strong>${username}</strong> liked your post`;
                    break;
                case "comment":
                    icon = "💬";
                    text = `<strong>${username}</strong> commented on your post`;
                    break;
                case "message":
                    icon = "✉️";
                    text = `<strong>${username}</strong> sent you a message`;
                    break;
                case "incoming_call":
                case "call":
                    icon = "📞";
                    extraClass = "incoming-call";
                    text = `Incoming call from <strong>${username}</strong>`;
                    break;
                case "missed_call":
                    icon = "📞❌";
                    extraClass = "missed-call";
                    text = `Missed call from <strong>${username}</strong>`;
                    break;
                default:
                    text = `New activity from <strong>${username}</strong>`;
            }

            const div = document.createElement("div");
            div.className = `notification ${notification.read ? "" : "unread"} ${extraClass}`;

            const timeStr = notification.createdAt 
                ? new Date(notification.createdAt).toLocaleString() 
                : "Just now";

            div.innerHTML = `
                <div class="noti-content">
                    <span class="noti-icon">${icon}</span>
                    <div>
                        <div class="noti-text">${text}</div>
                        <div class="time">${timeStr}</div>
                    </div>
                </div>
            `;

            div.onclick = async () => {
                if (!notification.read) {
                    try {
                        await fetch(`${API_URL}/api/notifications/${notification._id}/read`, {
                            method: "PUT",
                            headers: { Authorization: `Bearer ${token}` }
                        });
                        div.classList.remove("unread");
                        loadUnreadCount();
                    } catch (err) {
                        console.error("Error marking notification as read:", err);
                    }
                }

                // Route actions matching context
                if (notification.type === "like" || notification.type === "comment") {
                    window.location.href = `post.html?id=${notification.postId || notification.targetId}`;
                } else if (notification.type === "follow") {
                    if (notification.from?._id) {
                        localStorage.setItem("profileUserId", notification.from._id);
                    }
                    window.location.href = "profile.html";
                } else if (["message", "missed_call", "incoming_call", "call"].includes(notification.type)) {
                    if (notification.from) {
                        localStorage.setItem("chatUserId", notification.from._id || notification.from);
                        if (notification.from.username) {
                            localStorage.setItem("chatUsername", notification.from.username);
                        }
                    }
                    window.location.href = "chat.html";
                }
            };

            container.appendChild(div);
        });

    } catch(err) {
        console.error("Error loading notifications:", err);
    } finally {
        loading = false;
    }
}

// 2. Fetch Unread Count
async function loadUnreadCount() {
    try {
        const res = await fetch(`${API_URL}/api/notifications/unread-count`, {
            headers: { Authorization: `Bearer ${token}` }
        });
        const data = await res.json();
        document.getElementById("notificationBadge").innerText = data.count || 0;
    } catch (err) {
        console.error("Error fetching unread count:", err);
    }
}

// 3. UI Toast Function
function showToast(notification) {
    const sender = notification.from?.username || "Someone";
    let icon = "🔔";
    let message = `New activity from <strong>${sender}</strong>`;

    if (notification.type === "missed_call") {
        icon = "📞❌";
        message = `Missed call from <strong>${sender}</strong>`;
    } else if (["incoming_call", "call"].includes(notification.type)) {
        icon = "📞";
        message = `Incoming call from <strong>${sender}</strong>`;
    } else if (notification.type === "message") {
        icon = "💬";
        message = `New message from <strong>${sender}</strong>`;
    }

    const toast = document.createElement("div");
    toast.className = "toast";
    toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
    document.body.appendChild(toast);

    setTimeout(() => {
        toast.remove();
    }, 4000);
}

// --- EVENT LISTENERS ---

document.getElementById("markAllBtn").addEventListener("click", async () => {
    try {
        await fetch(`${API_URL}/api/notifications/read-all`, {
            method: "PUT",
            headers: { Authorization: `Bearer ${token}` }
        });
        page = 1;
        loadNotifications(1);
        loadUnreadCount();
    } catch(err) {
        console.error("Error marking all as read:", err);
    }
});

// Infinite Scroll with pagination bounds check
window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
        if (!loading && hasMore) {
            page++;
            loadNotifications(page);
        }
    }
});

// --- SOCKET INITIALIZATION WITH HANDSHAKE AUTH ---
if (typeof io !== "undefined" && currentUserId && token) {
    const socket = io(API_URL, {
        auth: { token: token },
        transports: ["websocket", "polling"]
    });

    socket.emit("join", currentUserId);

    const handleIncomingNotification = (notification) => {
        page = 1;
        loadNotifications(1);
        loadUnreadCount();
        if (notification) showToast(notification);
    };

    socket.on("notificationReceived", handleIncomingNotification);
    socket.on("newNotification", handleIncomingNotification);
}

// Initial Kick-off
loadNotifications(1);
loadUnreadCount();
</script>
<script src="chatBadge.js"></script>

</body>
</html>
