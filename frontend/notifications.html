<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Notifications - Vryza+</title>

<!-- Shared theme engine (dark / light / auto from Settings) -->
<script src="theme.js"></script>

<!-- PWA Web App Meta Tags -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- iOS Safari PWA Compatibility -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vryza+" />
<link rel="apple-touch-icon" href="images/icon-192.png" />

<!-- PWA Registration Script -->
<script src="sw-register.js" defer></script>

<style>
:root {
    --bg: #f1f5f9;
    --card: #ffffff;
    --card-hover: #f8fafc;
    --unread: #eff6ff;
    --text: #0f172a;
    --muted: #64748b;
    --line: #e2e8f0;
    --accent: #2563eb;
    --chip: #e2e8f0;
    --chip-hover: #cbd5e1;
}
html.dark {
    --bg: #0f172a;
    --card: #1e293b;
    --card-hover: #334155;
    --unread: #16243b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --line: #334155;
    --accent: #38bdf8;
    --chip: #334155;
    --chip-hover: #475569;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px));
    transition: background-color .2s ease, color .2s ease;
}

.page { max-width: 600px; margin: 0 auto; }

.topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    background: var(--bg);
    padding: calc(12px + env(safe-area-inset-top, 0px)) 0 12px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 14px;
}

.topbar-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }

.back-btn {
    background: var(--chip);
    color: var(--text);
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 12px;
    font-size: 18px;
    cursor: pointer;
    flex: none;
}
.back-btn:hover { background: var(--chip-hover); }

h2 { margin: 0; font-size: 1.4rem; font-weight: 800; white-space: nowrap; }

.badge-box {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
}

#notificationBadge {
    background: #ef4444;
    color: #fff;
    border-radius: 12px;
    padding: 2px 8px;
    font-size: 11px;
    font-weight: 800;
}

.actions-bar { margin-top: 12px; display: flex; gap: 8px; }

#markAllBtn {
    background: var(--chip);
    color: var(--text);
    border: none;
    padding: 10px 16px;
    min-height: 40px;
    border-radius: 12px;
    font-weight: 700;
    font-size: 13px;
    cursor: pointer;
    transition: background .2s;
}
#markAllBtn:hover { background: var(--chip-hover); }
#markAllBtn:disabled { opacity: .5; cursor: default; }

.notification {
    background: var(--card);
    padding: 12px 14px;
    border-radius: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: background .2s ease, transform .15s ease;
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 64px;
}
.notification:hover { background: var(--card-hover); }
.notification:active { transform: scale(.99); }

.notification.unread {
    border-left: 4px solid var(--accent);
    background: var(--unread);
}
.notification.missed-call { border-left: 4px solid #ef4444; }
.notification.incoming-call { border-left: 4px solid #22c55e; }

.avatar-wrap { position: relative; flex: none; width: 46px; height: 46px; }
.avatar {
    width: 46px; height: 46px; border-radius: 50%; object-fit: cover;
    background: var(--chip); display: block;
}
.type-icon {
    position: absolute; right: -4px; bottom: -4px; font-size: 14px; line-height: 1;
    background: var(--card); border-radius: 50%; padding: 2px;
}

.noti-body { min-width: 0; flex: 1; }
.noti-text { font-size: 14px; line-height: 1.4; overflow-wrap: anywhere; }
.time { color: var(--muted); font-size: 12px; margin-top: 3px; }

.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }

.state-msg { color: var(--muted); text-align: center; margin: 40px 0; font-size: 14px; }
.load-more {
    display: block; margin: 8px auto 0; background: var(--chip); color: var(--text); border: 0;
    padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer;
}

.toast {
    position: fixed;
    top: calc(14px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100vw - 28px);
    background: #0284c7;
    color: #fff;
    padding: 12px 18px;
    border-radius: 14px;
    z-index: 9999;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    animation: slideIn .3s ease;
}
@keyframes slideIn {
    from { transform: translate(-50%, -20px); opacity: 0; }
    to { transform: translate(-50%, 0); opacity: 1; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="page">
    <div class="topbar">
        <div class="topbar-row">
            <div class="topbar-left">
                <button class="back-btn" id="backBtn" aria-label="Back to home">←</button>
                <h2>Notifications</h2>
            </div>
            <div class="badge-box" aria-live="polite">
                🔔 Unread: <span id="notificationBadge">0</span>
            </div>
        </div>
        <div class="actions-bar">
            <button id="markAllBtn">Mark All As Read</button>
        </div>
    </div>

    <div id="notifications"></div>
    <button id="loadMoreBtn" class="load-more" style="display:none">Load more</button>
</div>

<!-- Absolute Socket.IO Client Script URL -->
<script src="https://vryza-connect-backend-1.onrender.com/socket.io/socket.io.js"></script>

<script>
const API_URL = "https://vryza-connect-backend-1.onrender.com";
const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.03-1.66 3.33-2.55 5.05-2.55 1.71 0 5.02.89 5.05 2.55C15.8 19.15 14.03 20 12 20z'/></svg>";

const rawToken = localStorage.getItem("token");
if (!rawToken) {
    window.location.href = "auth.html";
}
const token = rawToken ? rawToken.replace(/^Bearer\s+/i, "").trim() : "";

function decodeUserId(jwt) {
    try {
        let b64 = jwt.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        while (b64.length % 4) b64 += "=";
        const payload = JSON.parse(window.atob(b64));
        return String(payload.id || payload._id || payload.userId || "");
    } catch (e) {
        console.error("Failed to parse token payload", e);
        return "";
    }
}
const currentUserId = token ? decodeUserId(token) : "";

let page = 1;
let totalPages = 1;
let loading = false;
let reloadQueued = false;

const container = document.getElementById("notifications");
const loadMoreBtn = document.getElementById("loadMoreBtn");

function authHeaders() {
    return { Authorization: `Bearer ${token}` };
}

function handleUnauthorized(res) {
    if (res.status === 401) {
        localStorage.removeItem("token");
        window.location.href = "auth.html";
        return true;
    }
    return false;
}

function buildImage(src) {
    if (!src || src === "undefined" || src === "null") return DEFAULT_AVATAR;
    if (/^(https?:|data:)/.test(src)) return src;
    return `${API_URL}/uploads/${String(src).replace(/^\/?(uploads\/)?/, "")}`;
}

function timeAgo(dateStr) {
    if (!dateStr) return "Just now";
    const date = new Date(dateStr);
    const secs = Math.floor((Date.now() - date.getTime()) / 1000);
    if (isNaN(secs)) return "";
    if (secs < 45) return "Just now";
    if (secs < 3600) return `${Math.max(1, Math.round(secs / 60))}m ago`;
    if (secs < 86400) return `${Math.round(secs / 3600)}h ago`;
    if (secs < 604800) return `${Math.round(secs / 86400)}d ago`;
    return date.toLocaleDateString();
}

function idOf(value) {
    if (!value) return "";
    return String(typeof value === "object" ? (value._id || value.id || "") : value);
}

// Describes one notification: icon, sentence parts (safe, no HTML), style class.
function describe(n) {
    const name = n.from?.username || "Someone";
    const hasPost = !!idOf(n.postId);
    switch (n.type) {
        case "follow":
            return { icon: "👤", name, rest: " started following you", cls: "" };
        case "like":
            return { icon: "❤️", name, rest: hasPost ? " liked your post" : " liked your photo", cls: "" };
        case "comment":
            return { icon: "💬", name, rest: hasPost ? " commented on your post" : " commented on your photo", cls: "" };
        case "message":
            return { icon: "✉️", name, rest: " sent you a message", cls: "" };
        case "incoming_call":
        case "call":
            return { icon: "📞", before: "Incoming call from ", name, rest: "", cls: "incoming-call" };
        case "missed_call":
            return { icon: "📞", before: "Missed call from ", name, rest: "", cls: "missed-call" };
        default:
            return { icon: "🔔", before: "New activity from ", name, rest: "", cls: "" };
    }
}

function openNotification(n) {
    const fromId = idOf(n.from);

    if (n.type === "follow") {
        if (fromId) {
            localStorage.setItem("profileUserId", fromId);
            window.location.href = `user.html?id=${encodeURIComponent(fromId)}`;
        } else {
            window.location.href = "profile.html";
        }
    } else if (n.type === "like" || n.type === "comment") {
        // Likes/comments on your posts, profile picture and gallery photos all live on your own profile.
        window.location.href = "profile.html";
    } else if (["message", "missed_call", "incoming_call", "call"].includes(n.type)) {
        if (fromId) {
            localStorage.setItem("chatUserId", fromId);
            if (n.from?.username) localStorage.setItem("chatUsername", n.from.username);
            window.location.href = `chat.html?userId=${encodeURIComponent(fromId)}`;
        } else {
            window.location.href = "chat.html";
        }
    }
}

function renderNotification(n) {
    const d = describe(n);

    const row = document.createElement("div");
    row.className = `notification ${n.read ? "" : "unread"} ${d.cls}`.replace(/\s+/g, " ").trim();
    row.setAttribute("role", "button");
    row.tabIndex = 0;

    const wrap = document.createElement("div");
    wrap.className = "avatar-wrap";
    const img = document.createElement("img");
    img.className = "avatar";
    img.alt = "";
    img.loading = "lazy";
    img.src = buildImage(n.from?.profilePic || n.from?.avatar);
    img.addEventListener("error", () => { img.onerror = null; img.src = DEFAULT_AVATAR; }, { once: true });
    const badge = document.createElement("span");
    badge.className = "type-icon";
    badge.textContent = d.icon;
    wrap.append(img, badge);

    const body = document.createElement("div");
    body.className = "noti-body";
    const text = document.createElement("div");
    text.className = "noti-text";
    if (d.before) text.appendChild(document.createTextNode(d.before));
    const strong = document.createElement("strong");
    strong.textContent = d.name;
    text.appendChild(strong);
    if (d.rest) text.appendChild(document.createTextNode(d.rest));
    const time = document.createElement("div");
    time.className = "time";
    time.textContent = timeAgo(n.createdAt);
    if (n.createdAt) time.title = new Date(n.createdAt).toLocaleString();
    body.append(text, time);

    row.append(wrap, body);

    if (!n.read) {
        const dot = document.createElement("span");
        dot.className = "dot";
        dot.setAttribute("aria-label", "Unread");
        row.appendChild(dot);
    }

    const activate = async () => {
        if (!n.read) {
            n.read = true;
            row.classList.remove("unread");
            row.querySelector(".dot")?.remove();
            try {
                await fetch(`${API_URL}/api/notifications/${n._id}/read`, {
                    method: "PUT",
                    headers: authHeaders()
                });
                loadUnreadCount();
            } catch (err) {
                console.error("Error marking notification as read:", err);
            }
        }
        openNotification(n);
    };

    row.addEventListener("click", activate);
    row.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
    });

    return row;
}

// 1. Load Notifications from API
async function loadNotifications(pageNumber = 1) {
    if (loading) {
        if (pageNumber === 1) reloadQueued = true;
        return;
    }
    if (pageNumber > 1 && pageNumber > totalPages) return;
    loading = true;

    try {
        const res = await fetch(`${API_URL}/api/notifications?page=${pageNumber}`, { headers: authHeaders() });
        if (handleUnauthorized(res)) return;

        const data = await res.json();
        const list = data.notifications || (Array.isArray(data) ? data : []);

        if (pageNumber === 1) container.innerHTML = "";

        totalPages = Number(data.totalPages) || (list.length ? pageNumber + 1 : pageNumber);
        page = pageNumber;

        if (!list.length && pageNumber === 1) {
            container.innerHTML = `<p class="state-msg">No notifications yet.</p>`;
        } else {
            list.forEach((n) => container.appendChild(renderNotification(n)));
        }

        loadMoreBtn.style.display = page < totalPages ? "block" : "none";
    } catch (err) {
        console.error("Error loading notifications:", err);
        if (pageNumber === 1 && !container.children.length) {
            container.innerHTML = `<p class="state-msg">Couldn't load notifications. Pull down or tap to retry.</p>`;
            container.firstChild.style.cursor = "pointer";
            container.firstChild.onclick = () => loadNotifications(1);
        }
    } finally {
        loading = false;
        if (reloadQueued) {
            reloadQueued = false;
            loadNotifications(1);
        }
    }
}

// 2. Fetch Unread Count
async function loadUnreadCount() {
    try {
        const res = await fetch(`${API_URL}/api/notifications/unread-count`, { headers: authHeaders() });
        if (handleUnauthorized(res)) return;
        const data = await res.json();
        document.getElementById("notificationBadge").textContent = data.count || 0;
        if (window.NotificationBadge) window.NotificationBadge.set(data.count || 0);
    } catch (err) {
        console.error("Error fetching unread count:", err);
    }
}

// 3. UI Toast Function (plain text, never HTML)
function showToast(n) {
    const d = describe(n);
    const toast = document.createElement("div");
    toast.className = "toast";
    toast.setAttribute("role", "status");

    const icon = document.createElement("span");
    icon.textContent = d.icon;
    const msg = document.createElement("span");
    if (d.before) msg.appendChild(document.createTextNode(d.before));
    const strong = document.createElement("strong");
    strong.textContent = d.name;
    msg.appendChild(strong);
    if (d.rest) msg.appendChild(document.createTextNode(d.rest));

    toast.append(icon, msg);
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 4000);
}

// --- EVENT LISTENERS ---
document.getElementById("backBtn").addEventListener("click", () => {
    if (document.referrer && history.length > 1) history.back();
    else window.location.href = "home.html";
});

document.getElementById("markAllBtn").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    try {
        const res = await fetch(`${API_URL}/api/notifications/read-all`, { method: "PUT", headers: authHeaders() });
        if (handleUnauthorized(res)) return;
        await loadNotifications(1);
        loadUnreadCount();
    } catch (err) {
        console.error("Error marking all as read:", err);
    } finally {
        btn.disabled = false;
    }
});

loadMoreBtn.addEventListener("click", () => loadNotifications(page + 1));

// Infinite scroll (stops at the last page the server reports)
window.addEventListener("scroll", () => {
    if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 300) {
        if (!loading && page < totalPages) loadNotifications(page + 1);
    }
}, { passive: true });

// Refresh when the tab comes back (or is restored from the back button)
document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") { loadNotifications(1); loadUnreadCount(); }
});
window.addEventListener("pageshow", (e) => {
    if (e.persisted) { loadNotifications(1); loadUnreadCount(); }
});

// --- SOCKET INITIALIZATION WITH HANDSHAKE AUTH ---
if (typeof io !== "undefined" && currentUserId && token) {
    const socket = io(API_URL, {
        auth: { token: token },
        transports: ["websocket", "polling"]
    });

    socket.on("connect", () => socket.emit("join", currentUserId));

    // The server emits both event names for the same notification, so ignore repeats.
    const seenIds = new Set();
    const handleIncomingNotification = (notification) => {
        const id = notification && notification._id;
        if (id) {
            if (seenIds.has(id)) return;
            seenIds.add(id);
            setTimeout(() => seenIds.delete(id), 10000);
        }
        loadNotifications(1);
        loadUnreadCount();
        if (notification) showToast(notification);
    };

    socket.on("notificationReceived", handleIncomingNotification);
    socket.on("newNotification", handleIncomingNotification);
}

// Initial Kick-off
loadNotifications(1);
loadUnreadCount();
</script>
<script src="chatBadge.js"></script>

  <script src="callmanager.js"></script>
  <script src="notificationbadge.js" defer></script>
</body>
</html>
