    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "dark") {
      document.documentElement.style.background = "#0f172a";
      document.documentElement.style.color = "#fff";
    }
  })();
</script>

            <label class="block font-semibold mb-2 text-sm text-slate-700">Privacy Settings</label>

            <div id="myGroups" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>

            <h2 class="text-xl font-bold mb-4 text-slate-800">Discover Public Groups</h2>

<script>
const API_URL = "https://vryza-connect-backend-1.onrender.com";

function go(url) { window.location.href = url; }
function logout() { localStorage.clear(); window.location.href = "auth.html"; }

function getCleanToken() {
  const raw = localStorage.getItem("token");
  return raw ? raw.replace(/^Bearer\s+/i, "").trim() : null;
}

if (!getCleanToken()) { window.location.href = "auth.html"; }

let currentGroup = null;
let activeGroupMap = {};
let mediaRecorder = null;
let recordedChunks = [];
let isRecording = false;

let selectedGroupAvatarData = "";
let selectedImageData = "";
let selectedVideoData = "";

const socket = io(API_URL, {
    transports: ["websocket", "polling"],
    secure: true,
    auth: { token: getCleanToken() }
});

socket.on("connect", () => {
    const userId = getCurrentUserId();
    if (userId) socket.emit("join", userId);
});

socket.on("receiveGroupMessage", (data) => {
    const targetGroupId = String(data.groupId || data.group || data.message?.group || "");
    const senderId = String(data.senderId || data.sender?._id || data.sender?.id || data.sender || "");
    if (senderId === String(getCurrentUserId())) return;

    const currentGroupId = currentGroup ? String(currentGroup._id || currentGroup.id) : "";

    if (currentGroup && targetGroupId === currentGroupId) {
        addMessageToScreen({
            _id: data.messageId || data._id || data.message?._id,
            group: targetGroupId,
            sender: data.sender || { _id: senderId, username: data.username || "User" },
            text: data.message || data.text || data.message?.text || "",
            image: data.image || data.message?.image || "",
            video: data.video || data.message?.video || "",
            voice: data.voice || data.message?.voice || "",
            createdAt: data.createdAt || data.message?.createdAt || new Date().toISOString()
        });
    }
});

async function apiRequest(url, options = {}) {
    const token = getCleanToken();
    options.headers = {
        "Content-Type": "application/json",
        ...(options.headers || {}),
        Authorization: `Bearer ${token}`
    };
    const response = await fetch(API_URL + url, options);
    let data;
    try { data = await response.json(); } catch { data = {}; }
    if (!response.ok) throw new Error(data.message || "Something went wrong");
    return data;
}

function showCreateGroup() { document.getElementById("createGroupSection").classList.remove("hidden"); }
function hideCreateGroup() { 
    document.getElementById("createGroupSection").classList.add("hidden"); 
    clearGroupAvatar();
}

function handleGroupAvatarSelect(event) {
    const file = event.target.files?.[0];
    if (!file) return;
    if (!file.type.startsWith("image/")) return alert("Please select a valid image file.");
    if (file.size > 5 * 1024 * 1024) return alert("Logo image must be smaller than 5 MB.");

    const reader = new FileReader();
    reader.onload = function(e) {
        selectedGroupAvatarData = e.target.result;
        document.getElementById("avatarPreview").src = selectedGroupAvatarData;
        document.getElementById("avatarPreviewContainer").classList.remove("hidden");
    };
    reader.readAsDataURL(file);
}

function clearGroupAvatar() {
    selectedGroupAvatarData = "";
    const input = document.getElementById("groupAvatarInput");
    if (input) input.value = "";
    const container = document.getElementById("avatarPreviewContainer");
    if (container) container.classList.add("hidden");
}

async function createGroup() {
    const name = document.getElementById("groupName").value.trim();
    const description = document.getElementById("groupDescription").value.trim();
    const privacy = document.getElementById("groupPrivacy").value;

    if (!name) return alert("Please enter a group name");
    try {
        const response = await apiRequest("/api/groups", {
            method: "POST",
            body: JSON.stringify({ name, description, privacy, avatar: selectedGroupAvatarData })
        });
        alert("Group created!");
        hideCreateGroup();
        document.getElementById("groupName").value = "";
        document.getElementById("groupDescription").value = "";
        await loadGroups();
        const createdGroup = response.group || response;
        const createdGroupId = createdGroup ? String(createdGroup._id || createdGroup.id || "") : null;
        if (createdGroupId) openGroupById(createdGroupId);
    } catch (error) { alert(error.message); }
}

async function deleteGroup(groupId) {
    if (!confirm("Are you sure you want to permanently delete this group? This action cannot be undone.")) return;

    try {
        await apiRequest(`/api/groups/${groupId}`, { method: "DELETE" });
        alert("Group deleted successfully.");

        if (currentGroup && String(currentGroup._id || currentGroup.id) === String(groupId)) {
            closeGroupChat();
        }
        await loadGroups();
    } catch (error) {
        alert(error.message || "Failed to delete group.");
    }
}

async function deleteActiveGroup() {
    if (!currentGroup) return;
    const groupId = String(currentGroup._id || currentGroup.id);
    await deleteGroup(groupId);
}

async function loadGroups() {
    try {
        const myRes = await apiRequest("/api/groups/my");
        const pubRes = await apiRequest("/api/groups/public");

        const myGroups = myRes.groups || (Array.isArray(myRes) ? myRes : []);
        const publicGroups = pubRes.groups || (Array.isArray(pubRes) ? pubRes : []);

        activeGroupMap = {};
        const allGroups = [...myGroups, ...publicGroups];
        allGroups.forEach(g => {
            if (g) {
                const gId = String(g._id || g.id || "");
                if (gId) activeGroupMap[gId] = g;
            }
        });
        displayMyGroups(myGroups);
        displayPublicGroups(publicGroups, myGroups);
    } catch (error) { console.error("Load groups error:", error); }
}

function displayMyGroups(groups) {
    const container = document.getElementById("myGroups");
    container.innerHTML = "";
    if (!groups || groups.length === 0) {
        container.innerHTML = `<p class="text-gray-500 col-span-3">You haven't joined any groups yet.</p>`;
        return;
    }
    groups.forEach(group => container.innerHTML += groupCard(group, true));
}

function displayPublicGroups(groups, myGroups) {
    const container = document.getElementById("publicGroups");
    container.innerHTML = "";
    const myGroupIds = (myGroups || []).map(g => String(g._id || g.id));
    let count = 0;
    (groups || []).forEach(group => {
        const gId = String(group._id || group.id);
        if (!myGroupIds.includes(gId)) {
            container.innerHTML += groupCard(group, false);
            count++;
        }
    });
    if (count === 0) container.innerHTML = `<p class="text-gray-500 col-span-3">No new public groups available.</p>`;
}

function groupCard(group, isMember) {
    const groupId = String(group._id || group.id);
    const currentUserId = String(getCurrentUserId() || "");
    const creator = group.creator || group.owner;
    const ownerId = String(creator?._id || creator?.id || creator || "");
    const isOwner = currentUserId && ownerId === currentUserId;

    const avatarUrl = resolveMediaUrl(group.avatar || group.icon || group.logo);

    const logoHtml = avatarUrl
        ? `<img src="${escapeAttribute(avatarUrl)}" class="w-12 h-12 rounded-full object-cover border border-slate-200 shrink-0">`
        : `<div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 font-bold flex items-center justify-center text-lg shrink-0">
            ${(group.name || "G").charAt(0).toUpperCase()}
           </div>`;

    return `
        <div class="bg-white rounded-xl shadow p-5 flex flex-col justify-between border border-gray-100">
            <div>
                <div class="flex items-center justify-between gap-3 mb-3">
                    <div class="flex items-center gap-3 overflow-hidden">
                        ${logoHtml}
                        <div class="truncate">
                            <h3 class="font-bold text-lg text-gray-800 leading-snug truncate">${escapeHTML(group.name)}</h3>
                            <p class="text-gray-500 text-xs">${group.members ? group.members.length : 0} members</p>
                        </div>
                    </div>
                    ${isOwner ? `<button onclick="deleteGroup('${groupId}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-1.5 rounded-lg transition shrink-0" title="Delete Group">🗑️</button>` : ""}
                </div>
                <p class="text-gray-600 text-sm mb-4 line-clamp-2">${escapeHTML(group.description || "No description provided.")}</p>
            </div>
            <div>
                ${isMember 
                    ? `<button onclick="openGroupById('${groupId}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition shadow-sm">Open Group</button>`
                    : `<button onclick="joinGroup('${groupId}')" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold transition shadow-sm">Join Group</button>`}
            </div>
        </div>
    `;
}

async function joinGroup(groupId) {
    try {
        await apiRequest(`/api/groups/${groupId}/join`, { method: "POST" });
        alert("You joined the group!");
        await loadGroups();
    } catch (error) { alert(error.message); }
}

async function openGroupById(groupId) {
    const targetId = String(groupId);
    const group = activeGroupMap[targetId];
    if (!group) return;

    if (currentGroup && String(currentGroup._id || currentGroup.id) !== targetId) {
        socket.emit("leaveGroup", String(currentGroup._id || currentGroup.id));
    }

    currentGroup = group;
    socket.emit("joinGroup", targetId);

    document.getElementById("groupChat").classList.remove("hidden");
    document.getElementById("chatGroupName").textContent = group.name;
    document.getElementById("chatGroupMembers").textContent = `${group.members ? group.members.length : 0} members`;

    const avatarUrl = resolveMediaUrl(group.avatar || group.icon || group.logo);
    const avatarBox = document.getElementById("chatGroupAvatarBox");
    if (avatarUrl) {
        avatarBox.innerHTML = `<img src="${escapeAttribute(avatarUrl)}" class="w-10 h-10 rounded-full object-cover border-2 border-white shrink-0">`;
    } else {
        avatarBox.innerHTML = `<div class="w-10 h-10 rounded-full bg-white/20 text-white font-bold flex items-center justify-center text-lg shrink-0">${(group.name || "G").charAt(0).toUpperCase()}</div>`;
    }

    const currentUserId = String(getCurrentUserId() || "");
    const creator = group.creator || group.owner;
    const ownerId = String(creator?._id || creator?.id || creator || "");
    const isOwner = ownerId === currentUserId;
    const isAdmin = isOwner || (group.admins || []).some(a => String(a._id || a.id || a) === currentUserId);

    const deleteGroupHeaderBtn = document.getElementById("deleteGroupHeaderBtn");
    if (isOwner) {
        deleteGroupHeaderBtn.classList.remove("hidden");
    } else {
        deleteGroupHeaderBtn.classList.add("hidden");
    }

    const viewReportsBtn = document.getElementById("viewReportsBtn");
    if (isAdmin) {
        viewReportsBtn.classList.remove("hidden");
    } else {
        viewReportsBtn.classList.add("hidden");
    }

    loadReportSummary(targetId);
    loadMessages(targetId);
}

async function loadReportSummary(groupId) {
    try {
        const data = await apiRequest(`/api/groups/${groupId}/reports/summary`);
        const badge = document.getElementById("reportedBadge");
        badge.textContent = `⚠️ ${data.totalReportedUsersCount || 0} reported members`;
    } catch (err) {
        console.warn("Could not load report summary", err);
    }
}

function closeGroupChat() {
    if (currentGroup) socket.emit("leaveGroup", String(currentGroup._id || currentGroup.id));
    stopRecording(true);
    clearSelectedMedia();
    currentGroup = null;
    document.getElementById("groupChat").classList.add("hidden");
}

async function loadMessages(groupId) {
    try {
        const response = await apiRequest(`/api/groups/${groupId}/messages`);
        const messages = response.messages || (Array.isArray(response) ? response : []);
        const container = document.getElementById("groupMessages");
        container.innerHTML = "";
        if (Array.isArray(messages)) messages.forEach(msg => addMessageToScreen(msg));
        container.scrollTop = container.scrollHeight;
    } catch (error) { console.error("Load messages error:", error); }
}

function resolveMediaUrl(path) {
    if (!path) return "";
    if (path.startsWith("http") || path.startsWith("data:")) return path;
    return `${API_URL}/uploads/${path}`;
}

function addMessageToScreen(message) {
    const container = document.getElementById("groupMessages");
    if (!container || !message) return;

    const msgId = String(message._id || message.id || "");
    if (msgId && document.querySelector(`[data-message-id="${msgId}"]`)) return;

    const currentUser = String(getCurrentUserId() || "");
    const senderId = String(message.sender?._id || message.sender?.id || message.sender || "");
    const isMine = senderId === currentUser;

    const div = document.createElement("div");
    if (msgId) div.dataset.messageId = msgId;
    div.className = `flex ${isMine ? "justify-end" : "justify-start"}`;

    const bubbleClass = isMine ? "bg-blue-600 text-white rounded-br-none" : "bg-white border text-gray-800 rounded-bl-none";
    let contentHTML = "";

    const imageUrl = resolveMediaUrl(message.image);
    const videoUrl = resolveMediaUrl(message.video);
    const voiceUrl = resolveMediaUrl(message.voice);

    if (imageUrl) {
        contentHTML += `<div class="mb-2"><img src="${escapeAttribute(imageUrl)}" class="rounded-xl cursor-pointer border border-black/10" onclick="openMediaOverlay('${escapeAttribute(imageUrl)}', 'image')"></div>`;
    }

    if (videoUrl) {
        contentHTML += `<div class="mb-2"><video controls class="rounded-xl max-w-full"><source src="${escapeAttribute(videoUrl)}">Your browser does not support video.</video></div>`;
    }

    if (voiceUrl) {
        contentHTML += `<div class="mb-2"><audio controls class="w-full"><source src="${escapeAttribute(voiceUrl)}"></audio></div>`;
    }

    if (message.text) {
        contentHTML += `<p class="text-sm leading-relaxed break-words whitespace-pre-wrap">${escapeHTML(message.text)}</p>`;
    }

    if (!contentHTML.trim()) return;

    div.innerHTML = `
        <div class="${bubbleClass} p-3 rounded-2xl max-w-xs sm:max-w-md shadow-sm">
            <div class="flex justify-between items-center mb-1 gap-2">
                <p class="font-bold text-[10px] ${isMine ? "text-blue-200" : "text-blue-600"}">${escapeHTML(message.sender?.username || "User")}</p>
                ${!isMine ? `<button onclick="reportUser('${senderId}', '${escapeHTML(message.sender?.username || "User")}')" class="text-[10px] opacity-70 hover:opacity-100 hover:underline">⚠️ Report</button>` : ""}
            </div>
            ${contentHTML}
        </div>
    `;

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function handleMediaSelected(event, type) {
    const file = event.target.files?.[0];
    if (!file) return;

    if (type === 'image' && !file.type.startsWith("image/")) return alert("Select a valid image file.");
    if (type === 'video' && !file.type.startsWith("video/")) return alert("Select a valid video file.");

    if (file.size > 20 * 1024 * 1024) return alert("Please choose a media file smaller than 20 MB.");

    const reader = new FileReader();
    reader.onload = function(e) {
        clearSelectedMedia();
        const container = document.getElementById("mediaPreviewContainer");
        const previewBox = document.getElementById("previewMediaBox");
        const typeText = document.getElementById("mediaPreviewType");

        if (type === 'image') {
            selectedImageData = e.target.result;
            previewBox.innerHTML = `<img src="${selectedImageData}" class="w-full h-full object-cover">`;
            typeText.textContent = "Image selected";
        } else {
            selectedVideoData = e.target.result;
            previewBox.innerHTML = `<video src="${selectedVideoData}" class="w-full h-full object-cover"></video>`;
            typeText.textContent = "Video selected";
        }
        container.classList.remove("hidden");
    };
    reader.readAsDataURL(file);
}

function clearSelectedMedia() {
    selectedImageData = "";
    selectedVideoData = "";
    document.getElementById("groupImageInput").value = "";
    document.getElementById("groupVideoInput").value = "";
    document.getElementById("mediaPreviewContainer").classList.add("hidden");
    document.getElementById("previewMediaBox").innerHTML = "";
}

async function sendGroupMessage() {
    if (!currentGroup) return alert("Please open a group first.");
    if (isRecording) return alert("Stop recording first.");

    const groupId = String(currentGroup._id || currentGroup.id);
    const input = document.getElementById("messageInput");
    const text = input.value.trim();

    if (!text && !selectedImageData && !selectedVideoData) return;

    try {
        const body = {
            text: text,
            image: selectedImageData || "",
            video: selectedVideoData || "",
            voice: ""
        };

        const response = await apiRequest(`/api/groups/${groupId}/messages`, {
            method: "POST",
            body: JSON.stringify(body)
        });

        const newMessage = response.message || response;

        addMessageToScreen(newMessage);
        socket.emit("sendGroupMessage", { groupId: groupId, messageId: String(newMessage._id || newMessage.id || "") });

        input.value = "";
        clearSelectedMedia();
    } catch (error) { alert(error.message); }
}

async function toggleRecording() { isRecording ? stopRecording(false) : await startRecording(); }

async function startRecording() {
    if (!currentGroup) return alert("Please open a group first.");
    if (!navigator.mediaDevices?.getUserMedia) return alert("Voice recording not supported.");

    try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        recordedChunks = [];
        let mimeType = MediaRecorder.isTypeSupported("audio/webm;codecs=opus") ? "audio/webm;codecs=opus" : "audio/webm";

        mediaRecorder = new MediaRecorder(stream, { mimeType });
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
        mediaRecorder.onstop = async () => {
            stream.getTracks().forEach(t => t.stop());
            if (!recordedChunks.length || mediaRecorder.cancelled) {
                isRecording = false; updateRecordingUI(); return;
            }
            const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || "audio/webm" });
            await sendVoiceBlob(blob);
        };
        mediaRecorder.start();
        isRecording = true;
        updateRecordingUI();
    } catch (err) { alert("Microphone access denied or unavailable."); }
}

function stopRecording(cancel = false) {
    if (mediaRecorder && (mediaRecorder.state === "recording" || mediaRecorder.state === "paused")) {
        mediaRecorder.cancelled = Boolean(cancel);
        mediaRecorder.stop();
    } else {
        isRecording = false;
        updateRecordingUI();
    }
}

function updateRecordingUI() {
    const status = document.getElementById("recordingStatus");
    const button = document.getElementById("voiceButton");
    if (isRecording) {
        status.classList.remove("hidden");
        button.classList.replace("bg-gray-100", "bg-red-100");
        button.classList.replace("text-gray-700", "text-red-600");
        button.textContent = "⏹️";
    } else {
        status.classList.add("hidden");
        button.classList.replace("bg-red-100", "bg-gray-100");
        button.classList.replace("text-red-600", "text-gray-700");
        button.textContent = "🎤";
    }
}

async function sendVoiceBlob(blob) {
    if (!currentGroup) return;
    const groupId = String(currentGroup._id || currentGroup.id);

    try {
        const voiceData = await blobToDataURL(blob);
        const response = await apiRequest(`/api/groups/${groupId}/messages`, {
            method: "POST",
            body: JSON.stringify({ text: "", image: "", video: "", voice: voiceData })
        });
        const newMessage = response.message || response;
        addMessageToScreen(newMessage);
        socket.emit("sendGroupMessage", { groupId: groupId, messageId: String(newMessage._id || newMessage.id || "") });
    } catch (error) { alert(error.message); }
    finally { isRecording = false; updateRecordingUI(); }
}

function blobToDataURL(blob) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.onerror = reject;
        reader.readAsDataURL(blob);
    });
}

async function banUser(userId) {
    if (!currentGroup) return;
    if (!confirm("Are you sure you want to ban this user from the group?")) return;

    const groupId = String(currentGroup._id || currentGroup.id);
    try {
        await apiRequest(`/api/groups/${groupId}/ban`, {
            method: "POST",
            body: JSON.stringify({ userId: String(userId) })
        });
        alert("User has been banned.");
        openMembersModal();
    } catch (error) {
        alert(error.message);
    }
}

async function reportUser(userId, username) {
    if (!currentGroup) return;
    const reason = prompt(`Report ${username} for bad behaviour:`);
    if (!reason || !reason.trim()) return;

    const groupId = String(currentGroup._id || currentGroup.id);
    try {
        await apiRequest(`/api/groups/${groupId}/report`, {
            method: "POST",
            body: JSON.stringify({ userId: String(userId), reason: reason.trim() })
        });
        alert("Report submitted to group administrators.");
        loadReportSummary(groupId);
    } catch (error) { alert(error.message); }
}

function openMembersModal() {
    if (!currentGroup) return;
    const modal = document.getElementById("membersModal");
    const list = document.getElementById("membersList");

    const currentUserId = String(getCurrentUserId() || "");
    const creator = currentGroup.creator || currentGroup.owner;
    const ownerId = String(creator?._id || creator?.id || creator || "");
    const isOwner = ownerId === currentUserId;

    list.innerHTML = "";
    (currentGroup.members || []).forEach(member => {
        const memberId = String(member._id || member.id || member);
        const memberName = member.username || "Member";
        const isAdminMember = (currentGroup.admins || []).some(a => String(a._id || a.id || a) === memberId);
        const isOwnerMember = ownerId === memberId;

        let roleBadge = isOwnerMember ? "👑 Owner" : (isAdminMember ? "🛡️ Admin" : "Member");
        let showBanBtn = isOwner && !isAdminMember && !isOwnerMember;

        list.innerHTML += `
            <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg border">
                <div>
                    <p class="font-bold text-sm text-gray-800">${escapeHTML(memberName)}</p>
                    <p class="text-xs text-gray-500">${roleBadge}</p>
                </div>
                ${showBanBtn ? `<button onclick="banUser('${memberId}')" class="bg-red-500 hover:bg-red-600 text-white text-xs px-3 py-1 rounded font-bold transition">Ban</button>` : ""}
            </div>
        `;
    });

    modal.classList.remove("hidden");
}

function closeMembersModal() { document.getElementById("membersModal").classList.add("hidden"); }

async function openReportsModal() {
    if (!currentGroup) return;
    const groupId = String(currentGroup._id || currentGroup.id);
    const modal = document.getElementById("reportsModal");
    const list = document.getElementById("reportsList");

    list.innerHTML = "<p class='text-center text-sm text-gray-500'>Loading reports...</p>";
    modal.classList.remove("hidden");

    try {
        const response = await apiRequest(`/api/groups/${groupId}/reports`);
        const reports = response.reports || (Array.isArray(response) ? response : []);
        list.innerHTML = "";
        if (!reports || reports.length === 0) {
            list.innerHTML = "<p class='text-center text-sm text-gray-500'>No reported behaviour found.</p>";
            return;
        }

        reports.forEach(r => {
            list.innerHTML += `
                <div class="p-3 bg-red-50 border border-red-100 rounded-lg">
                    <div class="flex justify-between items-start mb-1">
                        <span class="font-bold text-sm text-red-700">User: ${escapeHTML(r.reportedUser?.username || "Unknown")}</span>
                        <span class="text-[10px] text-gray-400">${r.createdAt ? new Date(r.createdAt).toLocaleDateString() : ""}</span>
                    </div>
                    <p class="text-xs text-gray-700 mb-1"><strong>Reason:</strong> ${escapeHTML(r.reason)}</p>
                    <p class="text-[10px] text-gray-500">Reported by: ${escapeHTML(r.reportedBy?.username || "Anonymous")}</p>
                </div>
            `;
        });
    } catch (err) {
        list.innerHTML = `<p class="text-center text-sm text-red-500">${escapeHTML(err.message)}</p>`;
    }
}

function closeReportsModal() { document.getElementById("reportsModal").classList.add("hidden"); }

function openMediaOverlay(src, type) {
    const overlay = document.createElement("div");
    overlay.className = "fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4";
    overlay.innerHTML = `
        <button class="absolute top-4 right-4 text-white text-3xl font-bold" onclick="this.parentElement.remove()">✕</button>
        <img src="${escapeAttribute(src)}" class="max-w-full max-h-full object-contain rounded-lg">
    `;
    overlay.onclick = e => { if (e.target === overlay) overlay.remove(); };
    document.body.appendChild(overlay);
}

function handleMessageKey(e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendGroupMessage(); } }

function getCurrentUserId() {
    try {
        const user = JSON.parse(localStorage.getItem("user"));
        if (user && (user._id || user.id)) return String(user._id || user.id);

        const token = getCleanToken();
        if (token) {
            const payload = JSON.parse(atob(token.split('.')[1]));
            return String(payload.id || payload._id || payload.userId || "");
        }
    } catch (err) {
        console.error("Error reading current user ID:", err);
    }
    return null;
}

function escapeHTML(str) { const d = document.createElement("div"); d.textContent = str || ""; return d.innerHTML; }
function escapeAttribute(str) { return String(str || "").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }

loadGroups();
</script>
