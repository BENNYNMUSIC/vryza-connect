<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Groups - Vryza Connect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://vryza-connect-backend-1.onrender.com/socket.io/socket.io.js"></script>

    <style>
        body {
            background: #f3f4f6;
        }
        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="bg-white shadow p-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-4">
                <button onclick="window.location.href='home.html'" class="text-blue-600 font-semibold text-sm hover:underline">← Home</button>
                <h1 class="text-2xl font-bold">Vryza Connect Groups</h1>
            </div>
            <button onclick="showCreateGroup()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition font-medium">
                + Create Group
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4">

        <!-- CREATE GROUP SECTION -->
        <section id="createGroupSection" class="hidden bg-white p-6 rounded-xl shadow mb-6">
            <h2 class="text-xl font-bold mb-4">Create a Group</h2>
            <input id="groupName" type="text" placeholder="Group name" class="w-full border p-3 rounded-lg mb-3 outline-none focus:ring-2 focus:ring-blue-500">
            <textarea id="groupDescription" placeholder="Group description" class="w-full border p-3 rounded-lg mb-3 outline-none focus:ring-2 focus:ring-blue-500"></textarea>

            <label class="block font-semibold mb-2 text-sm text-gray-700">Privacy Settings</label>
            <select id="groupPrivacy" class="w-full border p-3 rounded-lg mb-4 outline-none focus:ring-2 focus:ring-blue-500">
                <option value="public">Public - Anyone can join</option>
                <option value="private">Private - Members must be invited</option>
            </select>

            <div class="flex gap-2">
                <button onclick="createGroup()" class="bg-green-600 text-white px-5 py-2 rounded-lg hover:bg-green-700 font-medium transition">Create</button>
                <button onclick="hideCreateGroup()" class="bg-gray-400 text-white px-5 py-2 rounded-lg hover:bg-gray-500 font-medium transition">Cancel</button>
            </div>
        </section>

        <!-- MY GROUPS -->
        <section class="mb-8">
            <h2 class="text-xl font-bold mb-4">My Groups</h2>
            <div id="myGroups" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <!-- PUBLIC GROUPS -->
        <section>
            <h2 class="text-xl font-bold mb-4">Discover Public Groups</h2>
            <div id="publicGroups" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <!-- GROUP CHAT MODAL -->
        <section id="groupChat" class="hidden fixed inset-0 bg-white z-50">
            <div class="h-full flex flex-col">
                <!-- CHAT HEADER -->
                <div class="p-4 bg-blue-600 text-white flex justify-between items-center shadow">
                    <div>
                        <h2 id="chatGroupName" class="font-bold text-xl"></h2>
                        <p id="chatGroupMembers" class="text-xs opacity-80"></p>
                    </div>
                    <button onclick="closeGroupChat()" class="text-2xl font-bold px-3 py-1 hover:bg-blue-700 rounded-lg transition">✕</button>
                </div>

                <!-- MESSAGES CONTAINER -->
                <div id="groupMessages" class="flex-1 overflow-y-auto p-4 bg-gray-100 space-y-3"></div>

                <!-- MESSAGE INPUT -->
                <div class="p-4 bg-white border-t flex gap-2">
                    <input id="messageInput" type="text" placeholder="Type a message..." class="flex-1 border p-3 rounded-lg outline-none focus:ring-2 focus:ring-blue-500" onkeydown="handleMessageKey(event)">
                    <button onclick="sendGroupMessage()" class="bg-blue-600 text-white px-6 rounded-lg font-semibold hover:bg-blue-700 transition">Send</button>
                </div>
            </div>
        </section>

    </main>

<script>
const API_URL = "https://vryza-connect-backend-1.onrender.com";

// Authentication Guard
function getToken() {
    return localStorage.getItem("token");
}

if (!getToken()) {
    window.location.href = "auth.html";
}

let currentGroup = null;
let activeGroupMap = {};

// Socket Connection for Real-Time Messages
const socket = io(API_URL, {
    transports: ["websocket", "polling"],
    secure: true
});

socket.on("connect", () => {
    console.log("🟢 Group Socket Connected:", socket.id);
    const userId = getCurrentUserId();
    if (userId) socket.emit("join", userId);
});

// Listener for incoming real-time socket messages
socket.on("receiveGroupMessage", (data) => {
    const targetGroupId = String(data.groupId || data.group || "");
    const senderId = String(data.senderId || data.sender?._id || data.sender || "");
    
    // Ignore duplicate render for messages sent by the logged-in user
    if (senderId === String(getCurrentUserId())) return;

    if (currentGroup && targetGroupId === String(currentGroup._id)) {
        addMessageToScreen({
            sender: { 
                _id: senderId, 
                username: data.username || "Peer" 
            },
            text: data.message || data.text
        });
    }
});

async function apiRequest(url, options = {}) {
    const token = getToken();
    options.headers = {
        "Content-Type": "application/json",
        ...(options.headers || {}),
        Authorization: `Bearer ${token}`
    };

    const response = await fetch(API_URL + url, options);
    const data = await response.json();

    if (!response.ok) {
        throw new Error(data.message || "Something went wrong");
    }
    return data;
}

function showCreateGroup() {
    document.getElementById("createGroupSection").classList.remove("hidden");
}

function hideCreateGroup() {
    document.getElementById("createGroupSection").classList.add("hidden");
}

async function createGroup() {
    const name = document.getElementById("groupName").value.trim();
    const description = document.getElementById("groupDescription").value.trim();
    const privacy = document.getElementById("groupPrivacy").value;

    if (!name) {
        alert("Please enter a group name");
        return;
    }

    try {
        const data = await apiRequest("/api/groups", {
            method: "POST",
            body: JSON.stringify({ name, description, privacy })
        });

        alert("Group created!");
        document.getElementById("groupName").value = "";
        document.getElementById("groupDescription").value = "";
        hideCreateGroup();
        await loadGroups();
        
        if (data.group && data.group._id) {
            openGroupById(data.group._id);
        }
    } catch (error) {
        alert(error.message);
    }
}

async function loadGroups() {
    try {
        const myGroups = await apiRequest("/api/groups/my");
        const publicGroups = await apiRequest("/api/groups/public");

        activeGroupMap = {};
        const allGroups = [...(Array.isArray(myGroups) ? myGroups : []), ...(Array.isArray(publicGroups) ? publicGroups : [])];
        
        allGroups.forEach(g => {
            if (g && g._id) {
                activeGroupMap[g._id] = g;
            }
        });

        displayMyGroups(myGroups);
        displayPublicGroups(publicGroups, myGroups);
    } catch (error) {
        console.error("Load groups error:", error);
    }
}

function displayMyGroups(groups) {
    const container = document.getElementById("myGroups");
    container.innerHTML = "";

    if (!groups || groups.length === 0) {
        container.innerHTML = `<p class="text-gray-500 col-span-3">You haven't joined any groups yet.</p>`;
        return;
    }

    groups.forEach(group => {
        container.innerHTML += groupCard(group, true);
    });
}

function displayPublicGroups(groups, myGroups) {
    const container = document.getElementById("publicGroups");
    container.innerHTML = "";

    const myGroupIds = (myGroups || []).map(group => group._id);
    let count = 0;

    (groups || []).forEach(group => {
        if (!myGroupIds.includes(group._id)) {
            container.innerHTML += groupCard(group, false);
            count++;
        }
    });

    if (count === 0) {
        container.innerHTML = `<p class="text-gray-500 col-span-3">No new public groups available to discover.</p>`;
    }
}

function groupCard(group, isMember) {
    const memberCount = group.members ? group.members.length : 0;

    return `
        <div class="bg-white rounded-xl shadow p-5 flex flex-col justify-between border border-gray-100">
            <div>
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-12 h-12 rounded-full bg-blue-100 text-blue-600 font-bold flex items-center justify-center text-lg shrink-0">
                        ${(group.name || "G").charAt(0).toUpperCase()}
                    </div>
                    <div>
                        <h3 class="font-bold text-lg text-gray-800 leading-snug">${escapeHTML(group.name)}</h3>
                        <p class="text-gray-500 text-xs">${memberCount} members</p>
                    </div>
                </div>
                <p class="text-gray-600 text-sm mb-4 leading-relaxed line-clamp-2">${escapeHTML(group.description || "No description provided.")}</p>
            </div>

            <div>
                <p class="text-xs font-semibold mb-3 ${group.privacy === "private" ? "text-amber-600" : "text-emerald-600"}">
                    ${group.privacy === "private" ? "🔒 Private" : "🌎 Public"}
                </p>

                ${isMember ? `
                    <button onclick="openGroupById('${group._id}')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-lg font-semibold transition shadow-sm">
                        Open Group
                    </button>
                ` : `
                    <button onclick="joinGroup('${group._id}')" class="w-full bg-green-600 hover:bg-green-700 text-white py-2 rounded-lg font-semibold transition shadow-sm">
                        Join Group
                    </button>
                `}
            </div>
        </div>
    `;
}

async function joinGroup(groupId) {
    try {
        await apiRequest(`/api/groups/${groupId}/join`, { method: "POST" });
        alert("You joined the group!");
        loadGroups();
    } catch (error) {
        alert(error.message);
    }
}

function openGroupById(groupId) {
    const group = activeGroupMap[groupId];
    if (!group) return;

    if (currentGroup && currentGroup._id !== groupId) {
        socket.emit("leaveGroup", currentGroup._id);
    }

    currentGroup = group;
    socket.emit("joinGroup", groupId);

    document.getElementById("groupChat").classList.remove("hidden");
    document.getElementById("chatGroupName").textContent = group.name;
    document.getElementById("chatGroupMembers").textContent = `${group.members ? group.members.length : 0} members`;

    loadMessages(group._id);
}

function closeGroupChat() {
    if (currentGroup) {
        socket.emit("leaveGroup", currentGroup._id);
    }
    currentGroup = null;
    document.getElementById("groupChat").classList.add("hidden");
}

async function loadMessages(groupId) {
    try {
        const messages = await apiRequest(`/api/groups/${groupId}/messages`);
        const container = document.getElementById("groupMessages");
        container.innerHTML = "";

        if (Array.isArray(messages)) {
            messages.forEach(message => {
                addMessageToScreen(message);
            });
        }

        container.scrollTop = container.scrollHeight;
    } catch (error) {
        console.error("Load messages error:", error);
    }
}

function addMessageToScreen(message) {
    const container = document.getElementById("groupMessages");
    if (!container) return;

    const currentUser = getCurrentUserId();
    const senderId = message.sender?._id || message.sender?.id || message.sender;
    const isMine = String(senderId) === String(currentUser);

    const div = document.createElement("div");
    div.className = `flex ${isMine ? "justify-end" : "justify-start"}`;

    div.innerHTML = `
        <div class="${isMine ? "bg-blue-600 text-white rounded-br-none" : "bg-white border text-gray-800 rounded-bl-none"} p-3 rounded-2xl max-w-xs sm:max-w-md shadow-sm">
            <p class="font-bold text-[10px] ${isMine ? "text-blue-200" : "text-blue-600"} mb-0.5">${escapeHTML(message.sender?.username || "User")}</p>
            <p class="text-sm leading-relaxed break-words">${escapeHTML(message.text || "")}</p>
        </div>
    `;

    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

async function sendGroupMessage() {
    if (!currentGroup) return;

    const input = document.getElementById("messageInput");
    const text = input.value.trim();
    if (!text) return;

    try {
        const message = await apiRequest(`/api/groups/${currentGroup._id}/messages`, {
            method: "POST",
            body: JSON.stringify({ text })
        });

        addMessageToScreen(message);
        
        // Emit through socket for real-time recipients
        const user = JSON.parse(localStorage.getItem("user") || "{}");
        socket.emit("sendGroupMessage", {
            groupId: currentGroup._id,
            senderId: getCurrentUserId(),
            username: user.username || "User",
            message: text,
            text: text
        });

        input.value = "";
    } catch (error) {
        alert(error.message);
    }
}

function handleMessageKey(event) {
    if (event.key === "Enter") {
        sendGroupMessage();
    }
}

function getCurrentUserId() {
    try {
        const user = JSON.parse(localStorage.getItem("user"));
        return user?._id || user?.id || null;
    } catch {
        return null;
    }
}

function escapeHTML(text) {
    const div = document.createElement("div");
    div.textContent = text || "";
    return div.innerHTML;
}

// Initial Boot Sequence
loadGroups();
</script>

</body>
</html>
