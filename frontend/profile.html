<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Vryza+ | Profile & Dashboard</title>

  <!-- PWA & Mobile Configuration -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS Safari PWA Compatibility -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vryza+" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <link rel="shortcut icon" href="images/vryza-connect.png" type="image/x-icon" />

  <script src="theme.js"></script>
  <!-- Early Navigation & Theme Loader -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.documentElement.classList.add("dark");
        document.documentElement.style.background = "#0f172a";
        document.documentElement.style.color = "#fff";
      }
    })();

    function go(page) { window.location.href = page; }
    function logout() {
      localStorage.clear();
      window.location.href = "auth.html";
    }
  </script>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <script src="sw-register.js" defer></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Dark Mode Theme Overrides matching Home */
    html.dark body {
      background-color: #0f172a !important;
      color: #f8fafc !important;
    }
    html.dark .bg-white {
      background-color: #1e293b !important;
      color: #f8fafc !important;
      border-color: #334155 !important;
    }
    html.dark .bg-slate-50 {
      background-color: #0f172a !important;
      color: #f8fafc !important;
      border-color: #334155 !important;
    }
    html.dark .text-slate-800, html.dark .text-slate-700, html.dark .text-slate-600 {
      color: #f1f5f9 !important;
    }
    html.dark .border-slate-200, html.dark .border-slate-100 {

    }
    html.dark nav {
      background-color: rgba(15, 23, 42, 0.95) !important;

  <style id="vryza-profile-refresh">
    :root {
      --vryza-bg: #f4f7fc;
      --vryza-card: #ffffff;
      --vryza-ink: #172033;
      --vryza-muted: #718096;
      --vryza-line: #e7ecf4;
      --vryza-blue: #3867f5;
      --vryza-violet: #7655e8;
      --vryza-shadow: 0 12px 35px rgba(25, 42, 85, .07);
    }
    html { scroll-behavior: smooth; }
    body {
      background:
        radial-gradient(ellipse at 12% 0%, rgba(79, 113, 255, .08), transparent 34rem),
        var(--vryza-bg) !important;
      color: var(--vryza-ink);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }
    body > nav {
      background: rgba(255,255,255,.88) !important;
      border-color: rgba(226,232,240,.85) !important;
      box-shadow: 0 5px 24px rgba(25,42,85,.06) !important;
      backdrop-filter: blur(18px);
    }
    body > nav > div { min-height: 68px; }
    body > nav button { transition: color .2s ease, transform .2s ease; }
    body > nav button:hover { transform: translateY(-2px); }
    main { padding-bottom: 36px; }
    main > div { align-items: start; }
    #editSidebar > div,
    #adminModerationCard,
    section > div.bg-white,
    section > div > div.bg-white,
    #postsContainer > div {
      border: 1px solid var(--vryza-line) !important;
      border-radius: 25px !important;
      box-shadow: var(--vryza-shadow) !important;
    }
    section > div:first-child { overflow: hidden; }
    #coverPreview { transition: transform .5s ease; }
    section > div:first-child > div:first-child {
      min-height: 190px;
      background-image: linear-gradient(120deg, #315cf4, #6553d9 55%, #a45be8) !important;
    }
    #avatar {

      border-radius: 25px !important;
      box-shadow: 0 12px 30px rgba(18,35,75,.2) !important;

    #username { letter-spacing: -.045em; }
    #bioText { max-width: 560px; line-height: 1.6; }
    #followersCount, #followingCount { font-variant-numeric: tabular-nums; }
    #profile > div {
      background: #f7f9fd !important;
      border: 1px solid #edf1f7 !important;
      border-radius: 17px !important;
      box-shadow: none !important;
      padding: 16px !important;

    }
    #profile > div:hover { border-color: #cbd7ff !important; transform: translateY(-2px); }
    #actionButtons button, #saveBtn, #adminModerationCard button {

    }
    #galleryGrid { gap: 12px !important; }
    #galleryGrid > div {
      border-radius: 18px !important;

      box-shadow: 0 5px 16px rgba(20,35,70,.06);

    }
    #galleryUploadWrapper label:hover, #coverUploadBtnWrapper label:hover { transform: translateY(-1px); }
    #editSidebar { scroll-margin-top: 90px; }

    }

    #postsContainer input { min-width: 0; }
    #profilePicModal, #galleryModal {
      padding: 18px;
      backdrop-filter: blur(9px);
    }
    #profilePicModal > div {
      border-radius: 24px !important;
      box-shadow: 0 25px 80px rgba(0,0,0,.28);
    }
    #galleryModal img { box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    button, label, a { -webkit-tap-highlight-color: transparent; }
    button:focus-visible, label:focus-within, input:focus-visible {
      outline: 3px solid rgba(56,103,245,.28);
      outline-offset: 2px;
    }
    .hide-scrollbar { scrollbar-width: none; }
    ::selection { background: rgba(56,103,245,.18); }
    html.dark body {
      background: #0b1220 !important;
      color: #e7edf8 !important;
    }
    html.dark body > nav {

      border-color: #26344b !important;
    }
    html.dark body > nav span, html.dark body > nav button { color: #cbd5e1; }
    html.dark #username, html.dark #profile > div p:last-child { color: #f1f5f9 !important; }
    html.dark #editSidebar > div,
    html.dark section > div:first-child,
    html.dark section > div:nth-child(2),
    html.dark #adminModerationCard,
    html.dark #postsContainer > div,
    html.dark #profilePicModal > div {

    }

    html.dark #postsContainer span, html.dark #profilePicModal p,
    html.dark #profilePicModal span { color: #dbe5f3; }

    html.dark #editSidebar select, html.dark #editSidebar textarea,
    html.dark #adminModerationCard input,
    html.dark #profilePicCommentInput, html.dark #postsContainer input {

    html.dark #avatar { border-color: #131f33 !important; }

      main { margin-top: 15px !important; padding-left: 12px !important; padding-right: 12px !important; }
      main > div { gap: 16px !important; }
      section { gap: 16px !important; }
      section > div:first-child > div:first-child { height: 175px !important; }
      section > div:first-child > div:nth-child(2) { padding: 0 16px 19px !important; }
      #avatar { width: 96px !important; height: 96px !important; border-radius: 22px !important; }
      #username { font-size: 20px !important; }
      #profile { gap: 9px !important; }
      #profile > div { padding: 13px !important; }
      #actionButtons { grid-template-columns: 1fr !important; }
      #galleryGrid { grid-template-columns: repeat(2,minmax(0,1fr)) !important; gap: 9px !important; }
      #editSidebar > div, section > div:nth-child(2) { padding: 18px !important; }
      #postsContainer > div > div:last-child { padding: 16px !important; }

      #profilePicModal > div { max-height: 94vh !important; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>


  <style id="vryza-gallery">
    :root {
      --vz-surface: #ffffff; --vz-ink: #172033; --vz-muted: #718096;
      --vz-line: #e7ecf4; --vz-soft: #f4f7fc; --vz-accent: #3867f5; --vz-like: #e11d48;
    }
    html.dark {
      --vz-surface: #131f33; --vz-ink: #e5edf8; --vz-muted: #94a3b8;
      --vz-line: #293950; --vz-soft: #0e192b;
    }
    body.vz-lock { overflow: hidden; touch-action: none; }

    /* ---- Gallery grid tiles ---- */
    .vz-tile {
      position: relative; aspect-ratio: 1 / 1; overflow: hidden; cursor: pointer;
      border-radius: 18px; background: var(--vz-soft); border: 1px solid var(--vz-line);
      -webkit-tap-highlight-color: transparent; outline-offset: 2px;
    }
    .vz-tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .vz-tile-meta {
      position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 12px;
      padding: 22px 10px 8px; color: #fff; font-size: 12px; font-weight: 700;
      background: linear-gradient(transparent, rgba(0,0,0,.68)); pointer-events: none;
    }
    .vz-liked { color: #fb7185; }
    .vz-del {
      position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; border-radius: 999px;
      border: 0; color: #fff; background: rgba(0,0,0,.55); font-size: 13px; line-height: 1; cursor: pointer;
    }
    .vz-del:hover, .vz-del:active { background: #e11d48; }

    /* ---- Photo viewer ---- */
    .vz-viewer { position: fixed; inset: 0; z-index: 60; display: flex; align-items: center; justify-content: center; }
    .vz-viewer.hidden { display: none !important; }
    .vz-backdrop { position: absolute; inset: 0; background: rgba(2,6,16,.86); backdrop-filter: blur(8px); }
    .vz-card {
      position: relative; display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr);
      width: min(1040px, 96vw); height: min(680px, 92dvh); overflow: hidden;
      border-radius: 24px; background: var(--vz-surface); color: var(--vz-ink);
      box-shadow: 0 30px 90px rgba(0,0,0,.5); animation: vz-pop .22s ease-out;
    }
    @keyframes vz-pop { from { transform: scale(.96); opacity: 0; } to { transform: none; opacity: 1; } }
    .vz-close {
      position: absolute; top: 10px; right: 10px; z-index: 5; width: 38px; height: 38px;
      border: 0; border-radius: 999px; background: rgba(0,0,0,.55); color: #fff; font-size: 15px; cursor: pointer;
    }
    .vz-stage { position: relative; display: flex; align-items: center; justify-content: center; background: #05080f; min-height: 0; }
    .vz-stage img { max-width: 100%; max-height: 100%; object-fit: contain; user-select: none; -webkit-user-drag: none; }
    .vz-nav {
      position: absolute; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border: 0;
      border-radius: 999px; background: rgba(255,255,255,.18); color: #fff; font-size: 26px;
      align-items: center; justify-content: center; cursor: pointer; display: flex; padding-bottom: 3px;
    }
    .vz-nav:hover { background: rgba(255,255,255,.34); }
    .vz-prev { left: 10px; } .vz-next { right: 10px; }
    .vz-pos { position: absolute; left: 12px; bottom: 10px; font-size: 12px; font-weight: 700; color: #fff;
      background: rgba(0,0,0,.5); padding: 3px 9px; border-radius: 999px; }
    .vz-side { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
    .vz-caption { padding: 18px 18px 0; font-size: 14px; font-weight: 600; margin: 0; overflow-wrap: anywhere; }
    .vz-actions { display: flex; align-items: center; gap: 14px; padding: 14px 18px; border-bottom: 1px solid var(--vz-line); margin-top: 8px; }
    .vz-like {
      display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--vz-line);
      background: var(--vz-soft); color: var(--vz-ink); padding: 9px 16px; border-radius: 999px;
      font-weight: 800; font-size: 14px; cursor: pointer; min-height: 44px; transition: transform .15s ease;
    }
    .vz-like:active { transform: scale(.94); }
    .vz-like:disabled { opacity: .5; cursor: default; }
    .vz-like-btn, .vz-liked-btn { background: rgba(225,29,72,.1) !important; border-color: rgba(225,29,72,.4) !important; color: var(--vz-like) !important; }
    .vz-count { color: var(--vz-muted); font-size: 13px; font-weight: 600; }
    .vz-comments { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 18px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
    .vz-empty { color: var(--vz-muted); font-size: 13px; font-style: italic; margin: 8px 0; }
    .vz-comment { display: flex; gap: 10px; align-items: flex-start; }
    .vz-comment > img { width: 32px; height: 32px; border-radius: 999px; object-fit: cover; flex: none; background: var(--vz-soft); }
    .vz-comment-body { flex: 1; min-width: 0; background: var(--vz-soft); border-radius: 14px; padding: 8px 12px; font-size: 13px; line-height: 1.45; }
    .vz-comment-name { font-weight: 800; margin-right: 6px; }
    .vz-comment-text { overflow-wrap: anywhere; }
    .vz-comment-del { border: 0; background: transparent; color: var(--vz-muted); width: 30px; height: 30px; font-size: 12px; cursor: pointer; border-radius: 999px; flex: none; }
    .vz-comment-del:hover { color: var(--vz-like); }
    .vz-composer { display: flex; gap: 8px; padding: 12px 14px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--vz-line); background: var(--vz-surface); }
    .vz-composer input {
      flex: 1; min-width: 0; min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 16px; /* 16px stops iOS zoom */
      border: 1px solid var(--vz-line); background: var(--vz-soft); color: var(--vz-ink); outline: none;
    }
    .vz-composer input:focus { border-color: var(--vz-accent); box-shadow: 0 0 0 3px rgba(56,103,245,.15); }
    .vz-composer button {
      border: 0; min-height: 44px; padding: 0 18px; border-radius: 999px; background: var(--vz-accent);
      color: #fff; font-weight: 800; font-size: 14px; cursor: pointer;
    }
    .vz-composer button:disabled, .vz-composer input:disabled { opacity: .5; }

    /* ---- Toast ---- */
    .vz-toast {
      position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px);
      z-index: 90; background: #0f172a; color: #fff; padding: 11px 18px; border-radius: 999px; font-size: 13px;
      font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s ease, transform .2s ease; max-width: 90vw;
    }
    .vz-toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ---- Phones: full-screen sheet ---- */
    @media (max-width: 760px) {
      .vz-card {
        grid-template-columns: 1fr; grid-template-rows: minmax(0, 46dvh) minmax(0, 1fr);
        width: 100vw; height: 100dvh; border-radius: 0;
      }
      .vz-close { top: calc(10px + env(safe-area-inset-top, 0px)); }
      .vz-nav { width: 38px; height: 38px; }
      #galleryGrid { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; gap: 6px !important; }
      #galleryGrid .vz-tile { border-radius: 12px; }
    }
    @media (max-width: 380px) { #galleryGrid { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; } }
    @media (prefers-reduced-motion: reduce) { .vz-card { animation: none; } }
  </style>

</head>

        <button onclick="go('live-studio.html')" class="text-slate-500 hover:text-blue-600 font-semibold flex flex-col items-center text-[11px] shrink-0 transition cursor-pointer">
          <span class="text-lg leading-none mb-0.5">🔴</span>
          <span>LIVE</span>
        </button>
        <button onclick="go('settings.html')" class="text-slate-500 hover:text-blue-600 font-semibold flex flex-col items-center text-[11px] shrink-0 transition cursor-pointer">
          <span class="text-lg leading-none mb-0.5">⚙️</span>
          <span>Settings</span>
        </button>
      </div>

      <!-- LOGOUT BUTTON -->
      <button onclick="logout()" class="text-rose-500 hover:text-rose-700 font-semibold flex flex-col items-center text-[11px] shrink-0 transition ml-2 cursor-pointer">
        <span class="text-lg leading-none mb-0.5">🚪</span>
        <span>Logout</span>
      </button>

    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 mt-6">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">

      <!-- MAIN PROFILE & CONTENT SECTION -->
      <section class="lg:col-span-8 order-1 lg:order-2 space-y-6">

        <!-- Cover & User Header Card -->
        <div class="bg-white rounded-3xl border border-slate-200 shadow-xs overflow-hidden">
          
          <div class="relative h-48 sm:h-64 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600">
            <img id="coverPreview" class="w-full h-full object-cover hidden" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/40 via-transparent to-transparent"></div>
            <div class="absolute bottom-4 right-4 z-10" id="coverUploadBtnWrapper">
              <label class="bg-white/20 backdrop-blur-md text-white border border-white/30 px-3.5 py-2 rounded-2xl cursor-pointer hover:bg-white/30 transition text-xs font-bold shadow-sm flex items-center gap-1.5">
                📸 <span>Swap Cover</span>
                <input type="file" id="coverImage" accept="image/*" class="hidden" />
              </label>
            </div>
          </div>

          <div class="p-6 sm:p-8 pt-0">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 -mt-12 sm:-mt-14 mb-6">
              
              <!-- Profile Avatar Header Info (Clickable for Likes/Comments) -->
              <div class="flex items-end gap-4">
                <div class="relative group cursor-pointer" onclick="openProfilePicModal()" title="Click to view, like & comment profile picture">
                  <img id="avatar" class="w-28 h-28 sm:w-32 sm:h-32 rounded-3xl object-cover border-4 border-white shadow-lg bg-white transition group-hover:scale-105" onerror="this.src='images/vryza-connect.png'" />
                  <div class="absolute inset-0 bg-black/40 rounded-3xl opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-bold backdrop-blur-2xs">
                    💬 View
                  </div>
                </div>
                <div class="bg-white/90 backdrop-blur-md pb-1">
                  <div class="flex items-center gap-2 flex-wrap">
                    <h1 id="username" class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight leading-tight break-words">Loading Profile...</h1>
                    <span id="adminBadgeContainer"></span>
                  </div>
                  <div class="flex items-center gap-2 mt-1">
                    <span id="relationshipStatusBadge" class="inline-flex items-center px-3 py-0.5 rounded-full text-xs font-bold bg-pink-100 text-pink-700 hidden shadow-2xs">
                      ❤️ <span id="relationshipStatusText">Single</span>
                    </span>
                  </div>
                  <p id="bioText" class="text-slate-500 text-xs sm:text-sm mt-1.5 font-medium italic break-words"></p>
                </div>
              </div>

              <!-- Followers / Following Stats -->
              <div class="flex gap-3 w-full sm:w-auto">
                <div class="flex-1 sm:flex-none bg-blue-50/80 border border-blue-100 px-4 py-3 rounded-2xl text-center min-w-[90px] shadow-2xs">
                  <p class="text-[9px] uppercase tracking-widest text-blue-500 font-black mb-0.5">Followers</p>
                  <p id="followersCount" class="text-lg font-black text-blue-600">0</p>
                </div>
                <div class="flex-1 sm:flex-none bg-slate-50 border border-slate-200/80 px-4 py-3 rounded-2xl text-center min-w-[90px] shadow-2xs">
                  <p class="text-[9px] uppercase tracking-widest text-slate-400 font-black mb-0.5">Following</p>
                  <p id="followingCount" class="text-lg font-black text-slate-700">0</p>
                </div>
              </div>
            </div>

            <!-- Profile Details Grid -->
            <div id="profile" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 text-xs sm:text-sm text-slate-700 mb-6"></div>

            <!-- ACTION BUTTONS: DIRECT MESSAGE, VOICE CALL, VIDEO CALL -->
            <div id="actionButtons" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              <button onclick="messageUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3.5 rounded-2xl font-bold shadow-sm shadow-blue-500/20 transition active:scale-[0.99] flex items-center justify-center gap-2 text-xs sm:text-sm cursor-pointer">
                💬 Direct Message
              </button>
              <button onclick="startCall('audio')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-2xl font-bold shadow-sm shadow-emerald-500/20 transition active:scale-[0.99] flex items-center justify-center gap-2 text-xs sm:text-sm cursor-pointer">
                📞 Voice Call
              </button>
              <button onclick="startCall('video')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-2xl font-bold shadow-sm shadow-indigo-500/20 transition active:scale-[0.99] flex items-center justify-center gap-2 text-xs sm:text-sm cursor-pointer">
                📹 Video Call
              </button>
            </div>
          </div>
        </div>

        <!-- PHOTO GALLERY SECTION (Redesigned & Polished) -->
        <div class="bg-white p-6 sm:p-7 rounded-3xl border border-slate-200 shadow-xs space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3.5">
            <h2 class="text-base sm:text-lg font-black text-slate-900 flex items-center gap-2.5">
              <span class="p-1.5 bg-blue-50 text-blue-600 rounded-xl">🖼️</span> Photo Gallery
            </h2>
            <div id="galleryUploadWrapper">
              <label class="bg-blue-50 text-blue-600 hover:bg-blue-100 border border-blue-200/80 px-3.5 py-2 rounded-xl cursor-pointer font-bold text-xs transition flex items-center gap-1.5 shadow-2xs">
                ➕ <span>Add Photo</span>
                <input type="file" id="galleryFileInput" accept="image/*" class="hidden" onchange="uploadGalleryPhoto(event)" />
              </label>
            </div>
          </div>

          <div id="galleryGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3.5">
            <!-- Dynamically populated photo gallery items -->
          </div>
        </div>

        <!-- ADMIN MODERATION PANEL -->
        <div id="adminModerationCard" class="hidden bg-white p-6 sm:p-7 rounded-3xl border border-rose-200 shadow-xs space-y-4">
          <div class="flex items-center justify-between border-b border-slate-100 pb-3.5">
            <h3 class="font-black text-rose-600 text-base flex items-center gap-2.5">
              <span class="p-1.5 bg-rose-50 text-rose-600 rounded-xl">🛡️</span> Administrator Control Console
            </h3>
            <span id="userBanStatusBadge" class="text-xs px-3 py-1 rounded-full font-bold shadow-2xs">Checking status...</span>
          </div>

          <div id="banActionContainer" class="space-y-3">
            <div class="flex flex-col sm:flex-row gap-2.5">
              <input type="number" id="adminBanMinutesInput" min="1" placeholder="Ban duration (minutes)" class="flex-1 bg-slate-50 border border-slate-200 p-3.5 rounded-2xl text-xs outline-none focus:border-rose-500 shadow-2xs" />
              <button onclick="adminBanTargetUser()" class="bg-rose-600 hover:bg-rose-700 text-white px-5 py-3.5 rounded-2xl text-xs font-bold transition shadow-sm cursor-pointer">
                🚫 Ban User
              </button>
            </div>
          </div>

          <div id="unbanActionContainer" class="hidden">
            <button onclick="adminUnbanTargetUser()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-2xl text-xs font-bold transition shadow-sm cursor-pointer">
              ✓ Lift User Ban (Unban)
            </button>
          </div>

          <div class="pt-2 border-t border-slate-100">
            <button id="adminMakeAdminBtn" onclick="adminMakeTargetUserAdmin()" class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3.5 rounded-2xl text-xs font-bold transition shadow-sm cursor-pointer">
              👑 Grant Admin Permissions
            </button>
          </div>
        </div>

        <!-- Feed Stream -->
        <div>
          <h2 class="text-base sm:text-lg font-black text-slate-900 mb-3 px-1 flex items-center gap-2.5">
            <span class="p-1.5 bg-blue-50 text-blue-600 rounded-xl">📦</span> Broadcasted Entries
          </h2>
          <div id="postsContainer" class="space-y-5"></div>
        </div>

      </section>

      <!-- SIDEBAR EDIT FORM -->
      <aside id="editSidebar" class="lg:col-span-4 order-2 lg:order-1 space-y-6">
        <div class="bg-white p-5 sm:p-6 rounded-3xl border border-slate-200 shadow-xs lg:sticky lg:top-24 space-y-5">
          <h2 class="text-base font-bold text-slate-900 flex items-center gap-2.5">
            <span class="p-1.5 bg-slate-100 text-slate-700 rounded-xl">⚙️</span> Customize Profile
          </h2>

          <div class="space-y-4">
            <div>
              <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Upload New Avatar</label>
              <input type="file" id="profilePic" accept="image/*" class="w-full text-xs text-slate-500 bg-slate-50 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 rounded-2xl p-2 border border-slate-200 shadow-2xs cursor-pointer transition" />
            </div>

            <div>
              <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Headline Bio</label>
              <textarea id="bio" placeholder="Your status headline..." rows="2" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm resize-none transition shadow-2xs"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Age Metric</label>
                <input id="age" type="number" placeholder="Age" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm transition shadow-2xs" />
              </div>
              <div>
                <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Gender</label>
                <select id="gender" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm transition h-[46px] shadow-2xs cursor-pointer">
                  <option value="">Unspecified</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <div>
              <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Relationship Status</label>
              <select id="relationshipStatus" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm transition h-[46px] shadow-2xs cursor-pointer">
                <option value="">Unspecified</option>
                <option value="Single">Single</option>
                <option value="In a Relationship">In a Relationship</option>
                <option value="Engaged">Engaged</option>
                <option value="Married">Married</option>
                <option value="It's Complicated">It's Complicated</option>
                <option value="Separated">Separated</option>
                <option value="Divorced">Divorced</option>
                <option value="Widowed">Widowed</option>
              </select>
            </div>

            <div>
              <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Geographical Location</label>
              <input id="location" type="text" placeholder="City, Country" class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm transition shadow-2xs" />
            </div>

            <div>
              <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">About Me Story</label>
              <textarea id="about" rows="3" placeholder="Tell the community about yourself..." class="w-full p-3.5 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm resize-none transition shadow-2xs"></textarea>
            </div>

            <button id="saveBtn" onclick="updateProfile()" class="w-full bg-slate-900 hover:bg-blue-600 text-white py-3.5 rounded-2xl font-bold transition shadow-md active:scale-[0.99] mt-2 text-xs sm:text-sm cursor-pointer">
              Save Profile Changes
            </button>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <!-- PROFILE PICTURE MODAL (Likes & Comments) -->
  <div id="profilePicModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl border border-slate-200 flex flex-col max-h-[90vh]">
      <div class="flex justify-between items-center px-6 py-4 border-b border-slate-100">
        <h3 class="font-bold text-slate-900 text-sm">Profile Picture</h3>
        <button onclick="closeProfilePicModal()" class="text-slate-400 hover:text-slate-600 font-bold text-lg cursor-pointer">✕</button>
      </div>
      <div class="bg-slate-900 flex items-center justify-center max-h-80 overflow-hidden">
        <img id="modalProfilePic" class="max-h-80 object-contain w-full" />
      </div>
      <div class="p-6 space-y-4 flex-1 overflow-y-auto">
        <div class="flex items-center gap-2">
          <button id="likeProfilePicBtn" onclick="likeProfilePicture()" class="px-4 py-2 rounded-xl bg-pink-50 text-pink-600 hover:bg-pink-100 font-bold text-xs transition flex items-center gap-1.5 cursor-pointer shadow-2xs">
            ❤️ <span id="profilePicLikesCount">0</span> Likes
          </button>
        </div>
        <div class="border-t border-slate-100 pt-3">
          <p class="text-xs font-bold text-slate-700 mb-2">Comments</p>
          <div id="profilePicCommentsList" class="space-y-2 max-h-36 overflow-y-auto pr-1"></div>
        </div>
      </div>
      <div class="p-4 border-t border-slate-100 bg-slate-50 flex gap-2">
        <input id="profilePicCommentInput" type="text" placeholder="Add a comment..." class="flex-1 bg-white border border-slate-200 px-3.5 py-2.5 text-xs rounded-xl outline-none focus:border-blue-500 shadow-2xs" />
        <button onclick="commentProfilePicture()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold transition cursor-pointer shadow-sm">Send</button>
      </div>
    </div>
  </div>

  <!-- PHOTO VIEWER (like, comment, swipe) -->
  <div id="galleryViewer" class="vz-viewer hidden" role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="vz-backdrop" onclick="closeGalleryViewer()"></div>
    <div class="vz-card">
      <button type="button" class="vz-close" onclick="closeGalleryViewer()" aria-label="Close viewer">✕</button>

      <div class="vz-stage">
        <button type="button" class="vz-nav vz-prev" onclick="galleryStep(-1)" aria-label="Previous photo">‹</button>
        <img id="vzViewerImg" alt="Gallery photo" draggable="false" />
        <button type="button" class="vz-nav vz-next" onclick="galleryStep(1)" aria-label="Next photo">›</button>
        <span id="vzPos" class="vz-pos"></span>
      </div>

      <div class="vz-side">
        <p id="vzCaption" class="vz-caption"></p>
        <div class="vz-actions">
          <button type="button" id="vzLikeBtn" class="vz-like" onclick="likeGalleryPhoto()">
            <span id="vzLikeIcon">♡</span> <span id="vzLikeCount">0</span>
          </button>
          <span id="vzCommentCount" class="vz-count">0 comments</span>
        </div>
        <div id="vzComments" class="vz-comments"></div>
        <div class="vz-composer">
          <input id="vzCommentInput" type="text" maxlength="500" placeholder="Add a comment…" enterkeyhint="send" autocomplete="off" />
          <button type="button" id="vzSendBtn" onclick="commentGalleryPhoto()">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="profile.js"></script>
  <script src="chatBadge.js"></script>
  <script src="callmanager.js"></script>
  <script src="notificationbadge.js" defer></script>
</body>
</html>
