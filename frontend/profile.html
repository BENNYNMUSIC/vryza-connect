<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vryza+ | Profile</title>

  <!-- PWA Web App Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />

  <!-- iOS Safari PWA Compatibility -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vryza+" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />

  <!-- PWA Registration Script -->
  <script src="sw-register.js" defer></script>

  <link rel="shortcut icon" href="images/vryza connect.png" type="image/x-icon" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: "Inter", sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 20px;
    }
  </style>
</head>

<body class="bg-slate-100/70 min-h-screen pt-16 sm:pt-20 antialiased text-slate-800">

  <!-- TOP NAVIGATION BAR -->
  <nav class="bg-white/80 backdrop-blur-md shadow-xs fixed top-0 left-0 w-full z-50 border-b border-slate-200/80">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-4 sm:px-6 py-3">

      <!-- Logo -->
      <div class="flex items-center gap-2.5 bg-slate-100/80 px-3 py-1.5 rounded-2xl border border-slate-200/60 shadow-inner cursor-pointer hover:bg-slate-200/60 transition" onclick="go('home.html')">
        <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-1.5 rounded-xl shadow-md shadow-blue-500/20">
          <img src="images/vryza connect.png" class="w-5 h-5 sm:w-5.5 sm:h-5.5 invert brightness-200" alt="logo" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'white\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M13 10V3L4 14h7v7l9-11h-7z\'/></svg>'" />
        </div>
        <span class="font-black text-slate-900 text-base tracking-tight">
          Vryza<span class="bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">+</span>
        </span>
      </div>

      <!-- Navigation Links -->
      <div class="flex items-center gap-1 sm:gap-2">
        <button onclick="go('home.html')" class="px-3 py-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition font-semibold text-xs sm:text-sm flex items-center gap-1.5 cursor-pointer">
          <span>🏠</span> <span class="hidden sm:inline">Home</span>
        </button>
        <button onclick="go('profile.html')" class="relative px-3 py-2 rounded-xl text-blue-600 font-bold text-xs sm:text-sm flex items-center gap-1.5 bg-blue-50/80 shadow-2xs">
          <span>👤</span> <span class="hidden sm:inline">Profile</span>
          <div class="hidden sm:block absolute bottom-0 left-0 w-full h-0.5 bg-blue-600 rounded-full"></div>
        </button>
        <button onclick="go('chat.html')" class="relative px-3 py-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition font-semibold text-xs sm:text-sm flex items-center gap-1.5 cursor-pointer">
          <span>💬</span> <span class="hidden sm:inline">Chat</span>
          <span id="chatUnreadBadge" class="hidden bg-blue-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full min-w-[18px] text-center shadow-sm">
            0
          </span>
        </button>
        <button onclick="go('settings.html')" class="px-3 py-2 rounded-xl text-slate-500 hover:text-blue-600 hover:bg-slate-100 transition font-semibold text-xs sm:text-sm flex items-center gap-1.5 cursor-pointer">
          <span>⚙️</span> <span class="hidden sm:inline">Settings</span>
        </button>
      </div>

    </div>
  </nav>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 sm:py-8">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8">

      <!-- MAIN PROFILE & CONTENT SECTION -->
      <section class="lg:col-span-8 order-1 lg:order-2 space-y-6">

        <!-- Cover & User Header -->
        <div class="bg-white rounded-3xl border border-slate-200/80 shadow-xs overflow-hidden">
          
          <div class="relative h-44 sm:h-60 bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600">
            <img id="coverPreview" class="w-full h-full object-cover hidden" />
            <div class="absolute inset-0 bg-gradient-to-t from-black/30 via-transparent to-transparent"></div>
            <div class="absolute bottom-4 right-4 z-10" id="coverUploadBtnWrapper">
              <label class="bg-white/20 backdrop-blur-md text-white border border-white/30 px-3.5 py-2 rounded-xl cursor-pointer hover:bg-white/30 transition text-[11px] font-bold tracking-wide shadow-sm uppercase flex items-center gap-1.5">
                📸 <span>Swap Cover</span>
                <input type="file" id="coverImage" accept="image/*" class="hidden" />
              </label>
            </div>
          </div>

          <div class="p-6 sm:p-8 pt-0">
            <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-4 -mt-10 sm:-mt-12 mb-6">
              
              <!-- Profile Avatar Header Info -->
              <div class="flex items-end gap-4">
                <div class="relative group">
                  <img id="avatar" class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl object-cover border-4 border-white shadow-md bg-white" onerror="this.src=DEFAULT_AVATAR" />
                </div>
                <div class="bg-white/90 backdrop-blur-md pb-1">
                  <h1 id="username" class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight leading-tight break-words">Loading Profile...</h1>
                  <p id="bioText" class="text-slate-500 text-xs sm:text-sm mt-0.5 font-medium italic break-words"></p>
                </div>
              </div>

              <!-- Followers / Following Stats -->
              <div class="flex gap-3 w-full sm:w-auto">
                <div class="flex-1 sm:flex-none bg-blue-50/80 border border-blue-100/80 px-4 py-2.5 rounded-2xl text-center min-w-[85px] shadow-2xs">
                  <p class="text-[9px] uppercase tracking-widest text-blue-500 font-black mb-0.5">Followers</p>
                  <p id="followersCount" class="text-lg font-black text-blue-600">0</p>
                </div>
                <div class="flex-1 sm:flex-none bg-slate-50 border border-slate-200/60 px-4 py-2.5 rounded-2xl text-center min-w-[85px] shadow-2xs">
                  <p class="text-[9px] uppercase tracking-widest text-slate-400 font-black mb-0.5">Following</p>
                  <p id="followingCount" class="text-lg font-black text-slate-700">0</p>
                </div>
              </div>
            </div>

            <!-- Profile Details Grid -->
            <div id="profile" class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 text-xs sm:text-sm text-slate-700 mb-6"></div>

            <!-- ACTION BUTTONS: DIRECT MESSAGE, VOICE CALL, VIDEO CALL -->
            <div id="actionButtons" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
              <button onclick="messageUser()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-2xl font-bold shadow-sm shadow-blue-500/20 transition active:scale-[0.99] flex items-center justify-center gap-2 text-xs sm:text-sm cursor-pointer">
                💬 Direct Message
              </button>
              <button onclick="startCall('audio')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-2xl font-bold shadow-sm shadow-emerald-500/20 transition active:scale-[0.99] flex items-center justify-center gap-2 text-xs sm:text-sm cursor-pointer">
                📞 Voice Call
              </button>
              <button onclick="startCall('video')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-2xl font-bold shadow-sm shadow-indigo-500/20 transition active:scale-[0.99] flex items-center justify-center gap-2 text-xs sm:text-sm cursor-pointer">
                📹 Video Call
              </button>
            </div>
          </div>
        </div>

        <!-- Feed Stream -->
        <div>
          <h2 class="text-base sm:text-lg font-black text-slate-900 mb-3 px-1 flex items-center gap-2">
            <span>📦</span> Broadcasted Entries
          </h2>
          <div id="postsContainer" class="space-y-4"></div>
        </div>

      </section>

      <!-- SIDEBAR EDIT FORM -->
      <aside id="editSidebar" class="lg:col-span-4 order-2 lg:order-1 space-y-6">
        <div class="bg-white p-5 sm:p-6 rounded-3xl border border-slate-200/80 shadow-xs lg:sticky lg:top-24">
          <h2 class="text-base font-bold text-slate-900 mb-5 flex items-center gap-2">
            <span>⚙️</span> Customize Profile
          </h2>

          <div class="space-y-4">
            <div>
              <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Upload New Avatar</label>
              <input type="file" id="profilePic" accept="image/*" class="w-full text-xs text-slate-500 bg-slate-50 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 rounded-2xl p-2 border border-slate-200/80 shadow-2xs cursor-pointer transition" />
            </div>

            <div>
              <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Headline Bio</label>
              <textarea id="bio" placeholder="Your status headline..." rows="2" class="w-full p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm resize-none transition shadow-2xs"></textarea>
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Age Metric</label>
                <input id="age" type="number" placeholder="Age" class="w-full p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm transition shadow-2xs" />
              </div>
              <div>
                <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Gender</label>
                <select id="gender" class="w-full p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm transition h-[46px] shadow-2xs cursor-pointer">
                  <option value="">Unspecified</option>
                  <option value="Male">Male</option>
                  <option value="Female">Female</option>
                  <option value="Other">Other</option>
                </select>
              </div>
            </div>

            <div>
              <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">Geographical Location</label>
              <input id="location" type="text" placeholder="City, Country" class="w-full p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm transition shadow-2xs" />
            </div>

            <div>
              <label class="text-[10px] uppercase font-black text-slate-400 ml-1 tracking-wider block mb-1.5">About Me Story</label>
              <textarea id="about" rows="3" placeholder="Tell the community about yourself..." class="w-full p-3.5 bg-slate-50 border border-slate-200/80 rounded-2xl outline-none focus:border-blue-500 focus:bg-white text-slate-800 text-xs sm:text-sm resize-none transition shadow-2xs"></textarea>
            </div>

            <button id="saveBtn" onclick="updateProfile()" class="w-full bg-slate-900 hover:bg-blue-600 text-white py-3.5 rounded-2xl font-bold transition shadow-md active:scale-[0.99] mt-2 text-xs sm:text-sm cursor-pointer">
              Save Profile Changes
            </button>
          </div>
        </div>
      </aside>

    </div>
  </main>

  <script src="profile.js"></script>
  <script>
    function go(page) {
      window.location.href = page;
    }
  </script>

</body>
</html>
