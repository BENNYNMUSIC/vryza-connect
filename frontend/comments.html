<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vryza+ | Comments & Discussion</title>

  <!-- PWA Web App Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vryza+" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <link rel="shortcut icon" href="images/vryza connect.png" type="image/x-icon" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <script>
    // Instant theme loader before render to prevent white flash
    (function() {
      const savedTheme = localStorage.getItem("theme");
      if (savedTheme === "dark") {
        document.documentElement.style.background = "#0f172a";
        document.documentElement.style.color = "#fff";
      }
    })();
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
  </style>
</head>

<body id="body" class="bg-slate-100 text-slate-800 min-h-screen pt-20 pb-24">

  <!-- NAVIGATION BAR -->
  <nav class="theme-card bg-white/95 backdrop-blur-md shadow-sm fixed top-0 left-0 w-full z-50 border-b border-slate-200">
    <div class="max-w-4xl mx-auto flex items-center justify-between px-4 py-3">
      <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='home.html'">
        <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-2 rounded-xl shadow-md">
          <img src="images/vryza connect.png" class="w-5 h-5 invert brightness-200" alt="logo">
        </div>
        <span class="font-black text-slate-800 text-base tracking-tight dark-text-target">
          Vryza<span class="text-blue-600">+</span>
        </span>
      </div>

      <div class="flex items-center gap-3">
        <button onclick="window.location.href='home.html'" class="text-xs font-semibold text-slate-600 hover:text-blue-600 transition">🏠 Home</button>
        <button onclick="window.location.href='settings.html'" class="text-xs font-semibold text-slate-600 hover:text-blue-600 transition">⚙️ Settings</button>
      </div>
    </div>
  </nav>

  <!-- MAIN CONTAINER -->
  <main class="max-w-2xl mx-auto px-4 mt-4 space-y-6">

    <!-- Back Button -->
    <button onclick="history.back()" class="flex items-center gap-2 text-xs font-semibold text-blue-600 hover:opacity-80 transition bg-white px-3 py-2 rounded-xl shadow-sm border border-slate-200 theme-card">
      <span>←</span> Back to Feed
    </button>

    <!-- Post Details Card -->
    <section id="postContainer" class="theme-card bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm p-5">
      <div class="flex items-center justify-center py-8 text-slate-400 text-xs italic">
        Loading post discussion...
      </div>
    </section>

    <!-- Comments Header -->
    <div class="flex items-center justify-between px-2">
      <h3 class="font-bold text-slate-800 text-base dark-text-target">💬 Discussion Thread</h3>
      <span id="commentCountBadge" class="text-xs bg-blue-50 text-blue-600 px-2.5 py-1 rounded-xl font-bold">0 comments</span>
    </div>

    <!-- Comments List Container -->
    <div id="commentsList" class="space-y-3">
      <!-- Comment items will be injected here -->
    </div>

  </main>

  <!-- FIXED COMMENT INPUT FOOTER -->
  <footer class="fixed bottom-0 left-0 w-full theme-card bg-white/95 backdrop-blur-md border-t border-slate-200 p-3 z-40 shadow-lg">
    <div class="max-w-2xl mx-auto flex gap-2">
      <input id="commentInput" type="text" placeholder="Write a comment..." class="flex-1 bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3 text-xs sm:text-sm outline-none focus:border-blue-500 transition shadow-inner">
      <button id="submitCommentBtn" onclick="submitComment()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-2xl font-bold text-xs sm:text-sm shadow-md shadow-blue-200 transition active:scale-95 shrink-0">
        Post
      </button>
    </div>
  </footer>

  <script src="comments.js"></script>
</body>
</html>
