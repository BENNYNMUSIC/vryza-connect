<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Owner Dashboard - Vryza+</title>

  <script src="theme.js"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vryza+" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <script src="sw-register.js" defer></script>
  <link rel="stylesheet" href="isadmin.css">

  <style>
    :root { --bg:#f1f5f9; --card:#fff; --soft:#f8fafc; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#2563eb; --chip:#e2e8f0; --bar:#dbeafe; }
    html.dark { --bg:#0b1220; --card:#162033; --soft:#101a2c; --text:#f8fafc; --muted:#94a3b8; --line:#2a3a52; --accent:#60a5fa; --chip:#26354d; --bar:#1e3a8a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:0 16px calc(28px + env(safe-area-inset-bottom,0px)); transition:background-color .2s,color .2s; }
    .owner-dashboard { max-width:640px; margin:0 auto; }
    .top { position:sticky; top:0; z-index:10; background:var(--bg); padding:calc(12px + env(safe-area-inset-top,0px)) 0 12px; display:flex; align-items:center; justify-content:space-between; gap:10px; border-bottom:1px solid var(--line); margin-bottom:16px; }
    .top h1 { margin:0; font-size:1.15rem; font-weight:800; }
    .back, .refresh { min-height:40px; border:0; border-radius:12px; background:var(--chip); color:var(--text); font:700 13px inherit; padding:0 14px; cursor:pointer; }
    .back { width:40px; padding:0; font-size:17px; }
    .intro { color:var(--muted); font-size:13px; margin:0 0 14px; }
    #top-questions-list { list-style:none; padding:0; margin:0; }
    #top-questions-list li { position:relative; overflow:hidden; padding:12px 14px; margin-bottom:10px; background:var(--card); border:1px solid var(--line); border-radius:14px; line-height:1.45; overflow-wrap:anywhere; }
    #top-questions-list li .bar { position:absolute; left:0; top:0; bottom:0; background:var(--bar); opacity:.55; z-index:0; }
    #top-questions-list li > *:not(.bar) { position:relative; z-index:1; }
    .rank { font-weight:800; color:var(--accent); margin-right:6px; }
    .ask-count { display:block; margin-top:4px; font-size:.82em; color:var(--muted); }
    #top-questions-list li.state { text-align:center; color:var(--muted); background:transparent; border-style:dashed; }
    #top-questions-list li.error { color:#dc2626; }
  </style>
</head>
<body>

  <div class="owner-dashboard">
    <header class="top">
      <div style="display:flex;align-items:center;gap:10px;min-width:0">
        <button class="back" onclick="location.href='admin.html'" aria-label="Back to admin console">←</button>
        <h1>📊 Most Asked Questions</h1>
      </div>
      <button class="refresh" id="refreshBtn" type="button">🔄 Refresh</button>
    </header>

    <p class="intro">The messages users send most often through Settings → Contact Admin. Matching is case-insensitive.</p>
    <ul id="top-questions-list"><li class="state">Loading…</li></ul>
  </div>

  <script>
    const ADMIN_API = "https://vryza-connect-backend-1.onrender.com/api/admin";

    function getCleanToken() {
      const raw = localStorage.getItem("token");
      return raw ? raw.replace(/^Bearer\s+/i, "").trim() : "";
    }

    function setMessage(listElement, text, isError) {
      const li = document.createElement("li");
      li.className = "state" + (isError ? " error" : "");
      li.textContent = text;
      listElement.replaceChildren(li);
    }

    async function fetchTopQuestions() {
      const listElement = document.getElementById("top-questions-list");
      const button = document.getElementById("refreshBtn");
      const token = getCleanToken();

      if (!token) { window.location.replace("auth.html"); return; }

      button.disabled = true;
      try {
        const res = await fetch(`${ADMIN_API}/top-questions`, {
          headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` }
        });

        if (res.status === 401) { localStorage.removeItem("token"); window.location.replace("auth.html"); return; }
        if (res.status === 403) { setMessage(listElement, "🔒 Administrator access required.", true); return; }
        if (!res.ok) throw new Error(`Server returned status ${res.status}`);

        const data = await res.json();
        const questions = Array.isArray(data && data.topQuestions) ? data.topQuestions : [];

        if (!questions.length) { setMessage(listElement, "No questions logged yet.", false); return; }

        const max = Math.max(...questions.map((q) => Number(q.count) || 0), 1);
        listElement.replaceChildren(...questions.map((item, index) => {
          const li = document.createElement("li");

          const bar = document.createElement("span");
          bar.className = "bar";
          bar.style.width = `${Math.max(6, Math.round(((Number(item.count) || 0) / max) * 100))}%`;

          const rank = document.createElement("strong");
          rank.className = "rank";
          rank.textContent = `#${index + 1}`;

          const text = document.createElement("span");
          text.textContent = `“${item.question || item._id || "Untitled"}”`;

          const count = document.createElement("span");
          count.className = "ask-count";
          const n = Number(item.count) || 0;
          count.textContent = `Asked ${n} time${n === 1 ? "" : "s"}`;

          li.append(bar, rank, text, count);
          return li;
        }));
      } catch (error) {
        console.error("Failed to fetch top questions:", error);
        setMessage(listElement, "Failed to load questions. Please check your connection and try again.", true);
      } finally {
        button.disabled = false;
      }
    }

    document.getElementById("refreshBtn").addEventListener("click", fetchTopQuestions);
    fetchTopQuestions();
  </script>

</body>
</html>
