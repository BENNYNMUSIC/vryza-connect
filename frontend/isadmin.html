<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Owner Dashboard</title>

  <!-- PWA Web App Meta Tags -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- iOS Safari PWA Compatibility -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vryza+" />
<link rel="apple-touch-icon" href="images/icon-192.png" />

<!-- PWA Registration Script -->
<script src="sw-register.js" defer></script>
  <link rel="stylesheet" href="isadmin.css">
  <style>
    .owner-dashboard {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      padding: 16px;
      margin: 0 auto;
    }

    #top-questions-list {
      list-style-type: none;
      padding: 0;
    }

    #top-questions-list li {
      padding: 10px 12px;
      margin-bottom: 8px;
      background-color: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
    }

    .ask-count {
      font-size: 0.85em;
      color: #6b7280;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <div class="owner-dashboard">
    <h2>📊 Most Asked Support Questions</h2>
    <ul id="top-questions-list">Loading...</ul>
  </div>

  <script>
    const ADMIN_API = "https://vryza-connect-backend-1.onrender.com/api/admin";

    async function fetchTopQuestions() {
      const listElement = document.getElementById('top-questions-list');
      if (!listElement) return;

      try {
        const token = localStorage.getItem("token");
        const res = await fetch(`${ADMIN_API}/top-questions`, {
          headers: {
            "Content-Type": "application/json",
            "Authorization": token ? `Bearer ${token}` : ""
          }
        });
        
        if (!res.ok) {
          throw new Error(`Server returned status ${res.status}`);
        }

        const data = await res.json();
        const questions = Array.isArray(data?.topQuestions) ? data.topQuestions : [];

        listElement.innerHTML = '';

        if (questions.length === 0) {
          const emptyItem = document.createElement('li');
          emptyItem.textContent = 'No questions logged yet.';
          listElement.appendChild(emptyItem);
          return;
        }

        questions.forEach((item, index) => {
          const li = document.createElement('li');

          const rankStrong = document.createElement('strong');
          rankStrong.textContent = `#${index + 1} `;

          const questionText = document.createTextNode(`"${item._id || 'Untitled'}" `);

          const countSpan = document.createElement('span');
          countSpan.className = 'ask-count';
          countSpan.textContent = `Asked ${item.count ?? 0} times`;

          li.appendChild(rankStrong);
          li.appendChild(questionText);
          li.appendChild(countSpan);

          listElement.appendChild(li);
        });
      } catch (error) {
        console.error('Failed to fetch top questions:', error);
        listElement.innerHTML = '';
        
        const errorItem = document.createElement('li');
        errorItem.textContent = 'Failed to load questions. Please check authentication or network connection.';
        listElement.appendChild(errorItem);
      }
    }

    fetchTopQuestions();
  </script>

</body>
</html>
