  <script>
    const API_URL = "https://vryza-connect-backend-1.onrender.com";
    let currentGroupModal = null;
    let homeGroupsMap = {};

    function escapeHTML(str) {
      const d = document.createElement("div");
      d.textContent = str || "";
      return d.innerHTML;
    }

    function escapeAttribute(str) {
      return String(str || "").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    function resolveMediaUrl(path) {
      if (!path) return "";
      if (path.startsWith("http") || path.startsWith("data:")) return path;
      return `${API_URL}/uploads/${path}`;
    }

    function getCleanTokenHome() {
      const raw = localStorage.getItem("token");
      return raw ? raw.replace(/^Bearer\s+/i, "").trim() : null;
    }

    async function apiRequestHome(url, options = {}) {
      const cleanToken = getCleanTokenHome();
      options.headers = {
        "Content-Type": "application/json",
        ...(options.headers || {}),
        Authorization: `Bearer ${cleanToken}`
      };
      const response = await fetch(API_URL + url, options);
      const data = await response.json();
      if (!response.ok) throw new Error(data.message || "Something went wrong");
      return data;
    }

    /* THEME FUNCTIONS */
    function updatePostPreviewTheme() {
      const caption = document.getElementById("caption");
      const bgInput = document.getElementById("postBgColor");
      const textInput = document.getElementById("postTextColor");
      if (!caption || !bgInput || !textInput) return;

      caption.style.backgroundColor = bgInput.value;
      caption.style.color = textInput.value;
    }

    function applyPostPreset(bgColor, textColor) {
      const bgInput = document.getElementById("postBgColor");
      const textInput = document.getElementById("postTextColor");
      if (bgInput) bgInput.value = bgColor;
      if (textInput) textInput.value = textColor;
      updatePostPreviewTheme();
    }

    /* LIGHTBOX FUNCTIONS */
    function openFullImage(src) {
      const lightbox = document.getElementById("imageLightbox");
      const img = document.getElementById("lightboxImage");
      if (lightbox && img) {
        img.src = src;
        lightbox.classList.remove("hidden");
      }
    }

    function closeFullImage() {
      const lightbox = document.getElementById("imageLightbox");
      if (lightbox) {
        lightbox.classList.add("hidden");
      }
    }

    /* SEARCH USERS FUNCTIONALITY */
    async function searchUsers() {
      const queryInput = document.getElementById("userSearchInput");
      const resultsContainer = document.getElementById("searchResults");
      if (!queryInput || !resultsContainer) return;

      const query = queryInput.value.trim();
      if (!query) {
        resultsContainer.classList.add("hidden");
        return;
      }

      resultsContainer.classList.remove("hidden");
      resultsContainer.innerHTML = '<p class="text-xs text-slate-400 p-2">Searching users...</p>';

      try {
        let users = [];
        try {
          const res = await apiRequestHome(`/api/users/search?q=${encodeURIComponent(query)}`);
          users = res.users || (Array.isArray(res) ? res : []);
        } catch (e) {
          const res = await apiRequestHome(`/api/users`);
          const allUsers = res.users || (Array.isArray(res) ? res : []);
          users = allUsers.filter(u => 
            (u.username && u.username.toLowerCase().includes(query.toLowerCase())) ||
            (u.name && u.name.toLowerCase().includes(query.toLowerCase()))
          );
        }

        if (users.length === 0) {
          resultsContainer.innerHTML = '<p class="text-xs text-slate-400 p-2">No users found.</p>';
          return;
        }

        const currentUserId = getCurrentUserId();
        resultsContainer.innerHTML = "";

        users.forEach(user => {
          const uId = String(user._id || user.id || "");
          const isMe = uId === currentUserId;
          const isAdmin = user.role === 'admin' || user.role === 'Admin' || user.isAdmin === true;
          const avatarUrl = resolveMediaUrl(user.profilePic || user.avatar) || 'images/vryza connect.png';

          resultsContainer.innerHTML += `
            <div class="flex items-center justify-between p-2 bg-white rounded-xl border border-slate-100 shadow-sm">
              <div class="flex items-center gap-2 overflow-hidden">
                <img src="${escapeAttribute(avatarUrl)}" class="w-7 h-7 rounded-full object-cover shrink-0" onerror="this.src='images/vryza connect.png'">
                <div class="truncate">
                  <p class="font-bold text-xs text-slate-800 truncate">
                    ${escapeHTML(user.username || user.name)}
                    ${isAdmin ? '<span class="text-[9px] bg-red-100 text-red-600 px-1 py-0.5 rounded ml-1 font-semibold">Admin</span>' : ''}
                  </p>
                </div>
              </div>
              ${!isMe ? `
                <button onclick="selectUserForChat('${uId}', '${escapeAttribute(user.username || user.name)}')" class="bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white px-2 py-1 rounded-lg text-[11px] font-semibold transition shrink-0">
                  Chat
                </button>
              ` : '<span class="text-[10px] text-slate-400">You</span>'}
            </div>
          `;
        });
      } catch (err) {
        resultsContainer.innerHTML = `<p class="text-xs text-red-400 p-2">Error: ${escapeHTML(err.message)}</p>`;
      }
    }

    /* RECOMMENDED USERS (ADMINS STRICTLY EXCLUDED) */
    async function loadRecommendedUsers() {
      const container = document.getElementById("recommendedUsers");
      if (!container) return;

      container.innerHTML = '<p class="text-xs text-slate-400 p-2">Finding suggested users...</p>';

      try {
        let users = [];
        try {
          const res = await apiRequestHome('/api/users/recommended');
          users = res.users || (Array.isArray(res) ? res : []);
        } catch (e) {
          const res = await apiRequestHome('/api/users');
          users = res.users || (Array.isArray(res) ? res : []);
        }

        const currentUserId = getCurrentUserId();

        // STRICT FILTER: Filter out current user AND ALL ADMINS
        const recommended = users.filter(user => {
          const uId = String(user._id || user.id || "");
          const isMe = uId === currentUserId;
          const isAdmin = user.role === 'admin' || user.role === 'Admin' || user.isAdmin === true;
          return !isMe && !isAdmin;
        });

        if (recommended.length === 0) {
          container.innerHTML = '<p class="text-xs text-slate-400 p-2">No recommended users at this time.</p>';
          return;
        }

        container.innerHTML = "";
        recommended.slice(0, 5).forEach(user => {
          const uId = String(user._id || user.id || "");
          const avatarUrl = resolveMediaUrl(user.profilePic || user.avatar) || 'images/vryza connect.png';

          container.innerHTML += `
            <div class="flex items-center justify-between p-2 bg-slate-50 hover:bg-slate-100/80 rounded-xl border border-slate-100 transition shadow-sm">
              <div class="flex items-center gap-2 overflow-hidden">
                <img src="${escapeAttribute(avatarUrl)}" class="w-8 h-8 rounded-full object-cover shrink-0" onerror="this.src='images/vryza connect.png'">
                <div class="truncate">
                  <p class="font-bold text-xs text-slate-800 truncate">${escapeHTML(user.username || user.name)}</p>
                  <p class="text-[10px] text-slate-400 truncate">${user.bio ? escapeHTML(user.bio) : 'Suggested user'}</p>
                </div>
              </div>
              <button onclick="selectUserForChat('${uId}', '${escapeAttribute(user.username || user.name)}')" class="bg-blue-600 text-white hover:bg-blue-700 px-2.5 py-1 rounded-xl text-[11px] font-semibold transition shrink-0 shadow-sm">
                Connect
              </button>
            </div>
          `;
        });
      } catch (err) {
        container.innerHTML = '<p class="text-xs text-slate-400 p-2">Unable to load recommendations.</p>';
      }
    }

    function selectUserForChat(userId, username) {
      const receiverInput = document.getElementById("receiverId");
      if (receiverInput) {
        receiverInput.value = username || userId;
        receiverInput.dataset.userId = userId;
      }
      receiverInput?.scrollIntoView({ behavior: 'smooth' });
    }

    async function fetchTopQuestions() {
      try {
        const res = await fetch(API_URL + '/api/admin/top-questions');
        const data = await res.json();
        const listElement = document.getElementById('top-questions-list');
        if (!listElement) return;
        listElement.innerHTML = '';

        if (!data.topQuestions || data.topQuestions.length === 0) {
          listElement.innerHTML = '<li class="text-slate-400">No questions logged yet.</li>';
          return;
        }

        data.topQuestions.forEach((item, index) => {
          const li = document.createElement('li');
          li.className = "flex items-center justify-between bg-slate-50 p-2 rounded-xl border border-slate-100";
          li.innerHTML = `
            <strong>#${index + 1}</strong> "${escapeHTML(item._id)}" 
            <span class="ask-count bg-blue-50 text-blue-600 px-2 py-0.5 rounded-lg text-[10px] font-bold">Asked ${item.count} times</span>
          `;
          listElement.appendChild(li);
        });
      } catch (err) {
        const listElement = document.getElementById('top-questions-list');
        if (listElement) listElement.innerHTML = '<li class="text-slate-400 text-xs">Unable to load insights.</li>';
      }
    }

    async function loadHomeMyGroups() {
      const container = document.getElementById("homeMyGroups");
      if (!container) return;
      try {
        const response = await apiRequestHome("/api/groups/my");
        const groups = response.groups || (Array.isArray(response) ? response : []);
        container.innerHTML = "";
        homeGroupsMap = {};

        if (!groups || groups.length === 0) {
          container.innerHTML = `<p class="text-xs text-slate-400 col-span-2">No groups joined yet. <a href="group.html" class="text-blue-600 underline">Explore groups</a></p>`;
          return;
        }

        groups.slice(0, 4).forEach(group => {
          const gId = String(group._id || group.id || "");
          if (gId) homeGroupsMap[gId] = group;

          const avatarPath = group.avatar || group.image || group.icon || group.logo;
          const groupImg = resolveMediaUrl(avatarPath) || 'images/vryza connect.png';

          container.innerHTML += `
            <div class="bg-slate-50 border border-slate-100 p-3 rounded-2xl flex items-center justify-between gap-2 shadow-sm">
              <div class="flex items-center gap-2.5 overflow-hidden">
                <img src="${escapeAttribute(groupImg)}" class="w-9 h-9 rounded-xl object-cover shrink-0" onerror="this.src='images/vryza connect.png'">
                <div class="truncate">
                  <h4 class="font-bold text-xs text-slate-800 truncate">${escapeHTML(group.name)}</h4>
                  <p class="text-[10px] text-slate-500">${group.members ? group.members.length : 0} members</p>
                </div>
              </div>
              <button onclick="openGroupByIdHome('${gId}')" class="bg-blue-50 text-blue-600 hover:bg-blue-600 hover:text-white px-3 py-1.5 rounded-xl text-xs font-semibold transition shrink-0">Open</button>
            </div>
          `;
        });
      } catch (err) {
        console.error("Failed to load user groups on home", err);
      }
    }

    function openGroupByIdHome(groupId) {
      const group = homeGroupsMap[groupId];
      if (group) openGroupModal(group);
    }

    function openGroupModal(group) {
      currentGroupModal = group;
      document.getElementById("groupChatModal").classList.remove("hidden");
      document.getElementById("chatGroupName").textContent = group.name;
      document.getElementById("chatGroupMembers").textContent = `${group.members ? group.members.length : 0} members`;
      loadModalGroupMessages(group._id || group.id);
    }

    function closeGroupChat() {
      currentGroupModal = null;
      document.getElementById("groupChatModal").classList.add("hidden");
    }

    async function loadModalGroupMessages(groupId) {
      try {
        const response = await apiRequestHome(`/api/groups/${groupId}/messages`);
        const messages = response.messages || (Array.isArray(response) ? response : []);
        const container = document.getElementById("groupChatMessagesContainer");
        container.innerHTML = "";
        messages.forEach(msg => appendModalMessage(msg));
        container.scrollTop = container.scrollHeight;
      } catch (err) {
        console.error("Load modal messages error:", err);
      }
    }

    function appendModalMessage(message) {
      const container = document.getElementById("groupChatMessagesContainer");
      if (!container || !message) return;

      const currentUser = getCurrentUserId();
      const senderId = String(message.sender?._id || message.sender?.id || message.sender || "");
      const isMine = senderId === currentUser;

      const div = document.createElement("div");
      div.className = `mb-3 flex ${isMine ? "justify-end" : "justify-start"}`;
      div.innerHTML = `
        <div class="${isMine ? "bg-blue-600 text-white" : "bg-white border border-slate-200 text-slate-800"} p-3 rounded-2xl max-w-xs sm:max-w-md shadow-sm text-xs sm:text-sm">
          <p class="font-semibold opacity-75 mb-0.5 text-[10px]">${escapeHTML(message.sender?.username || "User")}</p>
          <p>${escapeHTML(message.text || message.message || "")}</p>
        </div>
      `;
      container.appendChild(div);
    }

    async function sendModalGroupMessage() {
      if (!currentGroupModal) return;
      const groupId = String(currentGroupModal._id || currentGroupModal.id);
      const input = document.getElementById("modalMessageInput");
      const text = input.value.trim();
      if (!text) return;

      try {
        const response = await apiRequestHome(`/api/groups/${groupId}/messages`, {
          method: "POST",
          body: JSON.stringify({ text })
        });
        const newMessage = response.message || response;
        appendModalMessage(newMessage);
        input.value = "";
        const container = document.getElementById("groupChatMessagesContainer");
        container.scrollTop = container.scrollHeight;
      } catch (err) {
        alert(err.message);
      }
    }

    function handleModalMessageKey(event) {
      if (event.key === "Enter") sendModalGroupMessage();
    }

    function getCurrentUserId() {
      try {
        const user = JSON.parse(localStorage.getItem("user"));
        if (user && (user._id || user.id)) return String(user._id || user.id);
        const cleanToken = getCleanTokenHome();
        if (cleanToken) {
          const payload = JSON.parse(atob(cleanToken.split('.')[1]));
          return String(payload.id || payload._id || payload.userId || "");
        }
      } catch { return null; }
    }

    function previewUploadFile(input) {
      const targetBox = document.getElementById("mediaDisplayPreview");
      const labelText = document.getElementById("uploadPlaceholderText");
      if (!input.files || !input.files[0] || !targetBox) return;

      const file = input.files[0];
      const reader = new FileReader();
      labelText.innerText = `Selected: ${file.name}`;

      reader.onload = function(e) {
        targetBox.classList.remove("hidden");
        if (file.type.startsWith("image/")) {
          targetBox.innerHTML = `<img src="${e.target.result}" class="w-full h-auto object-cover max-h-48 block rounded-xl"/>`;
        } else {
          targetBox.innerHTML = `<video src="${e.target.result}" class="w-full h-auto object-cover max-h-48 block rounded-xl" muted autoplay loop></video>`;
        }
      }
      reader.readAsDataURL(file);
    }

    function renderCurrentPostAvatar() {
      const avatarContainer = document.getElementById("createPostUserAvatar");
      if (!avatarContainer) return;
      try {
        const storedUser = JSON.parse(localStorage.getItem("user") || "{}");
        if (storedUser.profilePic) {
          const picUrl = resolveMediaUrl(storedUser.profilePic);
          avatarContainer.innerHTML = `<img src="${escapeAttribute(picUrl)}" class="w-full h-full object-cover rounded-full" onerror="this.src='images/vryza connect.png'"/>`;
        } else if (storedUser.username) {
          avatarContainer.innerText = storedUser.username.charAt(0).toUpperCase();
        }
      } catch (e) {}
    }

    // Initialize Page
    renderCurrentPostAvatar();
    loadHomeMyGroups();
    fetchTopQuestions();
    loadRecommendedUsers();
  </script>
</body>
</html>
