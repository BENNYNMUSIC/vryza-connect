<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Offline - Vryza+</title>
<meta name="theme-color" content="#0f172a" />
<style>
  :root { --bg:#f1f5f9; --card:#fff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f172a; --card:#1e293b; --text:#f8fafc; --muted:#94a3b8; --line:#334155; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:24px;
    background:var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  .card { width:100%; max-width:380px; text-align:center; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:32px 24px; }
  .icon { width:72px; height:72px; border-radius:18px; margin:0 auto 16px; display:block; }
  h1 { margin:0 0 8px; font-size:1.4rem; } p { margin:0 0 22px; color:var(--muted); line-height:1.5; font-size:15px; }
  button { width:100%; min-height:48px; border:0; border-radius:14px; background:#2563eb; color:#fff; font:800 15px inherit; cursor:pointer; }
  a { display:block; margin-top:14px; color:var(--muted); font-size:14px; }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="images/icon-192.png" alt="" />
    <h1>You're offline</h1>
    <p>Vryza+ can't reach the internet right now. Check your connection and try again.</p>
    <button type="button" id="retry">Try again</button>
    <a href="home.html">Go to Home</a>
  </main>
  <script>
    document.getElementById("retry").addEventListener("click", function () { location.reload(); });
    window.addEventListener("online", function () { location.reload(); });
  </script>
</body>
</html>
