<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - User Management</title>

  <!-- PWA Web App Meta Tags -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- iOS Safari PWA Compatibility -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vryza+" />
<link rel="apple-touch-icon" href="images/icon-192.png" />

<!-- PWA Registration Script -->
<script src="sw-register.js" defer></script>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Script Deferred Load -->
  <script src="admin.js" defer></script>
</head>

<body class="bg-gray-50 min-h-screen text-gray-900 antialiased font-sans">

  <main class="max-w-4xl mx-auto px-4 py-10">
    
    <header class="mb-8 border-b border-gray-200 pb-5 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
      <div>
        <h1 class="text-3xl font-black tracking-tight text-gray-900 md:text-4xl">
          Admin Control Console
        </h1>
        <p class="text-sm text-gray-500 mt-1">
          Manage active user accounts, monitor status permissions, and enforce community system restrictions.
        </p>
      </div>

      <button
        type="button"
        onclick="fetchUsers()"
        class="self-start md:self-auto bg-gray-900 hover:bg-gray-800 text-white px-4 py-2.5 rounded-xl text-sm font-semibold transition shadow-sm"
      >
        🔄 Refresh List
      </button>
    </header>

    <section id="users" class="space-y-4">
      <!-- Dynamically populated user cards -->
    </section>

  </main>

</body>
</html>
