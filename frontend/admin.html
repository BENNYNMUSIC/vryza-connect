<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Admin Console - Vryza+</title>

  <!-- Shared theme engine (dark / light / auto from Settings) -->
  <script src="theme.js"></script>

  <!-- PWA Web App Meta Tags -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Vryza+" />
  <link rel="apple-touch-icon" href="images/icon-192.png" />
  <script src="sw-register.js" defer></script>

  <style>
    :root {
      --bg: #f1f5f9; --card: #ffffff; --soft: #f8fafc; --text: #0f172a; --muted: #64748b;
      --line: #e2e8f0; --accent: #2563eb; --danger: #dc2626; --ok: #16a34a; --purple: #7c3aed;
      --pill-ok: #dcfce7; --pill-ok-t: #166534; --pill-bad: #fee2e2; --pill-bad-t: #991b1b;
      --pill-admin: #ede9fe; --pill-admin-t: #5b21b6; --chip: #e2e8f0;
    }
    html.dark {
      --bg: #0f172a; --card: #1e293b; --soft: #162033; --text: #f8fafc; --muted: #94a3b8;
      --line: #334155; --accent: #60a5fa; --danger: #f87171; --ok: #4ade80; --purple: #a78bfa;
      --pill-ok: #14532d; --pill-ok-t: #bbf7d0; --pill-bad: #7f1d1d; --pill-bad-t: #fecaca;
      --pill-admin: #3b2a73; --pill-admin-t: #ddd6fe; --chip: #334155;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: var(--bg); color: var(--text); font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 0 16px calc(32px + env(safe-area-inset-bottom, 0px)); transition: background-color .2s, color .2s;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }

    .top { position: sticky; top: 0; z-index: 20; background: var(--bg); padding: calc(12px + env(safe-area-inset-top, 0px)) 0 12px; border-bottom: 1px solid var(--line); }
    .top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .title { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .title h1 { margin: 0; font-size: 1.25rem; font-weight: 800; white-space: nowrap; }
    .icon-btn { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--chip); font-size: 17px; flex: none; }
    .primary { background: var(--text); color: var(--bg); border: 0; border-radius: 12px; padding: 0 16px; min-height: 40px; font-weight: 700; font-size: 13px; }
    .sub { color: var(--muted); font-size: 13px; margin: 14px 0 0; }

    .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 16px 0; }
    .stat { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
    .stat b { display: block; font-size: 1.4rem; font-weight: 800; line-height: 1.1; }
    .stat span { color: var(--muted); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }

    .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
    .search { width: 100%; min-height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); outline: none; font-size: 16px; }
    .search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
    .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { border: 0; background: var(--chip); border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 700; white-space: nowrap; min-height: 40px; }
    .chip[aria-pressed="true"] { background: var(--accent); color: #fff; }
    html.dark .chip[aria-pressed="true"] { color: #0f172a; }
    .count { color: var(--muted); font-size: 12px; font-weight: 600; }

    .user { background: var(--card); border: 1px solid var(--line); border-radius: 18px; margin-bottom: 10px; overflow: hidden; }
    .user-head { display: flex; align-items: center; gap: 12px; padding: 14px; width: 100%; background: none; border: 0; text-align: left; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; background: var(--chip); flex: none; }
    .info { min-width: 0; flex: 1; }
    .name { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .email { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .pill { font-size: 11px; font-weight: 800; border-radius: 999px; padding: 3px 9px; }
    .pill.ok { background: var(--pill-ok); color: var(--pill-ok-t); }
    .pill.bad { background: var(--pill-bad); color: var(--pill-bad-t); }
    .pill.admin { background: var(--pill-admin); color: var(--pill-admin-t); }
    .pill.you { background: var(--chip); color: var(--muted); }
    .chev { color: var(--muted); transition: transform .2s; flex: none; }
    .user.open .chev { transform: rotate(180deg); }

    .panel { display: none; border-top: 1px solid var(--line); background: var(--soft); padding: 14px; gap: 14px; flex-direction: column; }
    .user.open .panel { display: flex; }
    .panel h4 { margin: 0 0 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; }
    .preset { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 14px; font-size: 13px; font-weight: 700; min-height: 42px; }
    .preset[aria-pressed="true"] { border-color: var(--danger); color: var(--danger); box-shadow: 0 0 0 2px rgba(220,38,38,.15); }
    .custom { display: flex; gap: 8px; margin-top: 8px; }
    .custom input, .custom select { min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; font-size: 16px; }
    .custom input { flex: 1; min-width: 0; }
    .btn { min-height: 46px; border-radius: 12px; border: 0; font-weight: 800; font-size: 14px; padding: 0 18px; color: #fff; }
    .btn.danger { background: var(--danger); } .btn.ok { background: var(--ok); } .btn.purple { background: var(--purple); }
    html.dark .btn { color: #0f172a; }
    .btn:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row .btn { flex: 1; min-width: 140px; }
    .note { font-size: 13px; color: var(--muted); margin: 0; }
    .banbox { background: var(--pill-bad); color: var(--pill-bad-t); border-radius: 12px; padding: 10px 12px; font-size: 13px; font-weight: 600; }

    .state { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 14px; }
    .state.error { color: var(--danger); }
    .more { display: block; margin: 8px auto 0; background: var(--chip); border: 0; border-radius: 12px; padding: 12px 20px; font-weight: 700; }

    .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 200; background: #0f172a; color: #fff;
      padding: 12px 18px; border-radius: 14px; font-size: 13px; font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,.35); max-width: calc(100vw - 32px); }
    .toast.err { background: #b91c1c; }

    .overlay { position: fixed; inset: 0; z-index: 150; background: rgba(2,6,16,.6); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
    .dialog { width: min(420px, 100%); background: var(--card); color: var(--text); border-radius: 20px; padding: 22px; box-shadow: 0 30px 80px rgba(0,0,0,.4); }
    .dialog h3 { margin: 0 0 6px; font-size: 18px; } .dialog p { margin: 0 0 18px; color: var(--muted); font-size: 14px; line-height: 1.5; }
    .dialog .row .btn.cancel { background: var(--chip); color: var(--text); }
    @media (min-width: 640px) { .overlay { align-items: center; } }
    @media (max-width: 520px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="top-row">
        <div class="title">
          <button class="icon-btn" onclick="location.href='home.html'" aria-label="Back to home">←</button>
          <h1>Admin Console</h1>
        </div>
        <button class="primary" id="refreshBtn" type="button">🔄 Refresh</button>
      </div>
    </header>

    <p class="sub">Manage accounts, enforce bans and grant administrator access.</p>

    <section class="stats" id="stats" aria-label="Summary"></section>

    <div class="toolbar">
      <input id="search" class="search" type="search" placeholder="Search by name or email…" autocomplete="off" enterkeyhint="search" />
      <div class="chips" id="filters" role="group" aria-label="Filter users"></div>
      <div class="count" id="count" aria-live="polite"></div>
    </div>

    <section id="users" aria-live="polite"></section>
  </div>

  <script src="admin.js"></script>
  <script src="callmanager.js"></script>
</body>
</html>
