<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Watch live - Vryza+</title>
<script src="theme.js"></script>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vryza+" />
<link rel="apple-touch-icon" href="images/icon-192.png" />
<script src="sw-register.js" defer></script>
<style>
    :root { --bg:#f1f5f9; --card:#ffffff; --soft:#f8fafc; --text:#0f172a; --muted:#64748b; --line:#e2e8f0; --accent:#2563eb; --live:#ef4444; --chip:#e2e8f0; --ok:#16a34a; }
    html.dark { --bg:#0b1220; --card:#162033; --soft:#101a2c; --text:#f8fafc; --muted:#94a3b8; --line:#2a3a52; --accent:#60a5fa; --live:#f87171; --chip:#26354d; --ok:#4ade80; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; padding:0 14px calc(28px + env(safe-area-inset-bottom,0px)); transition:background-color .2s,color .2s; }
    button,input,select,textarea { font:inherit; color:inherit; }
    button { cursor:pointer; }
    .wrap { max-width:1100px; margin:0 auto; }
    .top { position:sticky; top:0; z-index:30; background:var(--bg); padding:calc(10px + env(safe-area-inset-top,0px)) 0 10px; border-bottom:1px solid var(--line); margin-bottom:14px; }
    .top-row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .title { display:flex; align-items:center; gap:10px; min-width:0; }
    .title h1 { margin:0; font-size:1.2rem; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .icon-btn { width:40px; height:40px; border:0; border-radius:12px; background:var(--chip); font-size:17px; flex:none; }
    .btn { min-height:44px; border:0; border-radius:12px; padding:0 18px; font-weight:800; font-size:14px; background:var(--chip); }
    .btn.live { background:var(--live); color:#fff; } .btn.primary { background:var(--accent); color:#fff; } .btn.ok { background:var(--ok); color:#06210f; }
    html.dark .btn.primary { color:#0b1220; }
    .btn:disabled { opacity:.5; cursor:default; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:16px; margin-bottom:14px; }
    .card h2 { margin:0 0 12px; font-size:15px; font-weight:800; }
    .pill { display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:800; border-radius:999px; padding:4px 10px; background:var(--chip); }
    .pill.live { background:var(--live); color:#fff; }
    .muted { color:var(--muted); font-size:13px; }
    .toast { position:fixed; left:50%; bottom:calc(22px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:300; background:#0f172a; color:#fff; padding:12px 18px; border-radius:14px; font-size:13px; font-weight:600; box-shadow:0 10px 30px rgba(0,0,0,.4); max-width:calc(100vw - 28px); }
    .toast.err { background:#b91c1c; }
    input,select,textarea { width:100%; min-height:46px; padding:10px 14px; border-radius:12px; border:1px solid var(--line); background:var(--soft); font-size:16px; outline:none; }
    input:focus,select:focus,textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(37,99,235,.15); }
    textarea { resize:vertical; min-height:84px; }
    label { display:block; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:0 0 6px; }
    .field { margin-bottom:14px; }
    .avatar { width:44px; height:44px; border-radius:50%; object-fit:cover; background:var(--chip); flex:none; }
    @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }

    .layout { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:14px; align-items:start; }
    .player { position:relative; aspect-ratio:16/9; background:#000; border-radius:18px; overflow:hidden; }
    .player video { width:100%; height:100%; object-fit:contain; background:#000; display:block; }
    .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; color:#fff; background:rgba(0,0,0,.55); text-align:center; padding:16px; font-weight:700; }
    .overlay.hidden { display:none; }
    .spin { width:34px; height:34px; border:3px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; animation:spin 1s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    .badges { position:absolute; left:10px; top:10px; display:flex; gap:8px; z-index:3; }
    .badges .pill { background:rgba(0,0,0,.6); color:#fff; } .badges .pill.live { background:var(--live); }
    #giftBanner { position:absolute; left:12px; right:12px; bottom:14px; z-index:4; pointer-events:none; display:flex; justify-content:center; }
    .gift { background:linear-gradient(135deg,#f59e0b,#ef4444); color:#fff; font-weight:800; padding:10px 18px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.4); animation:pop .35s ease-out; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    @keyframes pop { from { transform:translateY(20px) scale(.9); opacity:0; } to { transform:none; opacity:1; } }
    .host { display:flex; align-items:center; gap:12px; }
    .host a { color:inherit; text-decoration:none; font-weight:800; }
    .presets { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
    .presets button { min-height:48px; border-radius:12px; border:1px solid var(--line); background:var(--soft); font-weight:800; font-size:14px; }
    .presets button:active { transform:scale(.96); }
    .presets.gifts button { display:flex; flex-direction:column; align-items:center; gap:2px; padding:8px 4px; font-size:11px; }
    .presets.gifts button span:first-child { font-size:24px; }
    .row2 { display:grid; grid-template-columns:1fr 110px; gap:8px; margin-bottom:8px; }
    .sec-title { font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); margin:14px 0 8px; }
    .feed { max-height:340px; overflow-y:auto; display:flex; flex-direction:column; gap:8px; }
    .item { background:var(--soft); border:1px solid var(--line); border-radius:12px; padding:8px 12px; font-size:13px; overflow-wrap:anywhere; }
    .item.super { background:#f59e0b; color:#1c1200; border-color:#f59e0b; }
    @media (max-width:860px) { .layout { grid-template-columns:1fr; } .player { border-radius:0 0 18px 18px; margin:0 -14px; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <div class="title">
        <button class="icon-btn" id="backBtn" aria-label="Back to live list">←</button>
        <h1 id="pageTitle">Live</h1>
      </div>
      <span class="pill" id="balancePill" title="Your coin balance">💰 …</span>
    </div>
  </header>

  <div class="layout">
    <main>
      <div class="player">
        <video id="player" playsinline autoplay muted controls></video>
        <div class="badges"><span class="pill live" id="liveBadge" hidden>● LIVE</span><span class="pill" id="viewerPill">👁 0</span></div>
        <div class="overlay" id="overlay"><div class="spin" id="spin"></div><span id="overlayText">Connecting…</span></div>
        <button type="button" id="soundBtn" hidden style="position:absolute;right:12px;bottom:14px;z-index:5;border:0;border-radius:999px;padding:10px 16px;font-weight:800;background:#fff;color:#0f172a;box-shadow:0 6px 18px rgba(0,0,0,.4)">🔊 Tap for sound</button>
        <div id="giftBanner" aria-live="polite"></div>
      </div>

      <div class="card" style="margin-top:14px">
        <div class="host">
          <img class="avatar" id="hostPic" alt="" />
          <div style="min-width:0"><a id="hostName" href="#">Streamer</a><div class="muted" id="category"></div></div>
        </div>
        <h2 id="streamTitle" style="margin:14px 0 4px;font-size:18px"></h2>
        <p class="muted" id="streamDesc" style="margin:0"></p>
      </div>
    </main>

    <aside>
      <div class="card" id="supportCard">
        <h2>Support the streamer</h2>
        <p class="muted" id="supportNote" style="margin:-6px 0 10px" hidden></p>

        <div class="sec-title" style="margin-top:0">Tip</div>
        <div class="presets" id="tips"></div>

        <div class="sec-title">Send a gift</div>
        <div class="presets gifts" id="gifts"></div>

        <div class="sec-title">Super Chat (min 100)</div>
        <div class="row2">
          <input id="scMsg" type="text" maxlength="200" placeholder="Your message…" autocomplete="off" />
          <input id="scAmt" type="number" min="100" step="1" inputmode="numeric" placeholder="Coins" />
        </div>
        <button class="btn primary" id="scBtn" type="button" style="width:100%">Send Super Chat</button>
      </div>

      <div class="card">
        <h2>Supporters</h2>
        <div class="feed" id="feed"><span class="muted">Tips and gifts will appear here.</span></div>
      </div>
    </aside>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.15.7/dist/livekit-client.umd.min.js"></script>
<script src="https://vryza-connect-backend-1.onrender.com/socket.io/socket.io.js"></script>
<script src="live-viewer.js"></script>
<script src="callmanager.js"></script>
</body>
</html>
