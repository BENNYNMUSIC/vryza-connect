<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vryza+ | View Profile</title>
  <!-- PWA Web App Meta Tags -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#0f172a" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- iOS Safari PWA Compatibility -->
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Vryza+" />
<link rel="apple-touch-icon" href="images/icon-192.png" />

<!-- PWA Registration Script -->
<script src="sw-register.js" defer></script>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://vryza-connect-backend-1.onrender.com/socket.io/socket.io.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght=400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body { font-family: "Inter", sans-serif; transition: background-color 0.2s; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pt-20">

  <!-- TOP NAVIGATION BAR -->
  <nav class="bg-white/90 backdrop-blur-md shadow-sm fixed top-0 left-0 w-full z-50 border-b border-slate-200">
    <div class="max-w-6xl mx-auto flex items-center justify-between px-4 sm:px-6 py-2.5">
      <div class="flex items-center gap-2 sm:gap-3 cursor-pointer" onclick="go('home.html')">
        <div class="bg-gradient-to-tr from-blue-600 to-indigo-500 p-1.5 rounded-xl shadow-md">
          <img src="images/vryza connect.png" class="w-5 h-5 invert brightness-200" alt="logo" onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=\'http://www.w3.org/2000/svg\' fill=\'none\' viewBox=\'0 0 24 24\' stroke=\'white\'><path stroke-linecap=\'round\' stroke-linejoin=\'round\' stroke-width=\'2\' d=\'M13 10V3L4 14h7v7l9-11h-7z\'/></svg>';">
        </div>
        <span class="font-black text-slate-800 text-base tracking-tight">
          Vryza<span class="text-blue-600">+</span>
        </span>
      </div>

      <div class="flex items-center gap-4 sm:gap-6 text-xs sm:text-sm">
        <button onclick="go('home.html')" class="text-slate-500 hover:text-blue-600 font-semibold transition">Home</button>
        <button onclick="go('profile.html')" class="text-slate-500 hover:text-blue-600 font-semibold transition">Profile</button>
        
        <button onclick="go('chat.html')" class="relative text-slate-500 hover:text-blue-600 font-semibold transition flex items-center gap-1.5">
          <span>💬 Chat</span>
          <span id="chatUnreadBadge" class="hidden bg-blue-600 text-white text-[10px] font-black px-1.5 py-0.5 rounded-full min-w-[18px] text-center shadow-sm">
            0
          </span>
        </button>

        <button onclick="logout()" class="text-red-500 font-semibold hover:text-red-700 transition">Logout</button>
      </div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-4 my-6">
    <div id="profileCard" class="theme-card bg-white rounded-3xl shadow-sm border border-slate-200 p-8 transition-colors duration-200">
      
      <div id="profileContainer" class="space-y-6">
        <div class="flex items-center justify-center py-12">
          <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
          <span class="ml-3 text-slate-500 font-medium">Retrieving community identity profile...</span>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API = "https://vryza-connect-backend-1.onrender.com";
    const DEFAULT_AVATAR = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2394a3b8'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 4c1.93 0 3.5 1.57 3.5 3.5S13.93 13 12 13s-3.5-1.57-3.5-3.5S10.07 6 12 6zm0 14c-2.03 0-3.8-.85-5.05-2.2.03-1.66 3.33-2.55 5.05-2.55 1.71 0 5.02.89 5.05 2.55C15.8 19.15 14.03 20 12 20z'/></svg>";

    const token = localStorage.getItem("token");
    const currentUser = JSON.parse(localStorage.getItem("user") || "{}");
    const currentUserId = String(currentUser._id || currentUser.id || "");

    const urlParams = new URLSearchParams(window.location.search);
    const profileUserId = urlParams.get("id") || localStorage.getItem("profileUserId");

    function go(page) {
      window.location.href = page;
    }

    function logout() {
      localStorage.clear();
      window.location.href = "auth.html";
    }

    if (!token || !profileUserId) {
      alert("Session footprint missing or profile target unset.");
      window.location.href = "auth.html";
    }

    function getHeaders() {
      const cleanToken = token.replace(/^Bearer\s+/i, "").trim();
      return {
        "Authorization": `Bearer ${cleanToken}`,
        "Content-Type": "application/json"
      };
    }

    function buildAvatarUrl(src) {
      if (!src || src === "undefined" || src === "null") return null;
      if (src.startsWith("http://") || src.startsWith("https://") || src.startsWith("data:")) {
        return src;
      }
      const cleanPath = src.replace(/^\/?(uploads\/)?/, '');
      return `${API}/uploads/${cleanPath}`;
    }

    function startDirectChat() {
      localStorage.setItem("chatUserId", profileUserId);
      window.location.href = `chat.html?userId=${profileUserId}`;
    }

    async function loadProfile() {
      const container = document.getElementById("profileContainer");
      
      try {
        let res = await fetch(`${API}/api/user/${profileUserId}`, {
          method: "GET",
          headers: getHeaders()
        });

        if (res.status === 404) {
          res = await fetch(`${API}/api/users/${profileUserId}`, {
            method: "GET",
            headers: getHeaders()
          });
        }

        const data = await res.json();

        if (!res.ok) {
          container.innerHTML = `<div class="text-center text-red-500 font-bold p-4">${data.message || "Failed to parse target account identification."}</div>`;
          return;
        }

        const user = data.user || data.profile || data;
        const avatarUrl = buildAvatarUrl(user.profilePic);
        const userInitial = (user.username || "U").charAt(0).toUpperCase();

        const avatarHTML = avatarUrl 
          ? `<img src="${avatarUrl}" alt="${user.username}" class="w-full h-full object-cover" onerror="this.onerror=null; this.src='${DEFAULT_AVATAR}';" />`
          : `<span class="text-3xl font-black text-white">${userInitial}</span>`;

        const isSelf = String(user._id || user.id) === currentUserId;

        container.innerHTML = `
          <div class="flex flex-col sm:flex-row items-center gap-5 pb-6 border-b border-slate-100">
            <div class="w-24 h-24 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 text-white flex items-center justify-center text-3xl font-black shadow-md overflow-hidden border-2 border-slate-100">
              ${avatarHTML}
            </div>
            <div class="text-center sm:text-left">
              <h1 class="text-3xl font-black text-slate-800 tracking-tight">${user.username || "Anonymous Connection"}</h1>
              <p class="text-slate-400 text-sm mt-1">${user.email || "Protected Network Address"}</p>
            </div>
          </div>

          <div class="space-y-4 text-sm text-slate-600 pt-2">
            <div class="bg-slate-50 p-4 rounded-2xl border border-slate-100">
              <p class="font-bold text-slate-400 uppercase text-[10px] tracking-wider mb-1">Personal Biography Statement</p>
              <p class="text-base text-slate-700 italic">"${user.bio || "No status bio updated by the account owner yet."}"</p>
            </div>
            
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
              <div class="p-3 bg-slate-50 rounded-xl border border-slate-100"><span class="block text-[10px] uppercase font-bold text-slate-400">Location</span><span class="font-semibold text-slate-800">${user.location || "Earth"}</span></div>
              <div class="p-3 bg-slate-50 rounded-xl border border-slate-100"><span class="block text-[10px] uppercase font-bold text-slate-400">Gender</span><span class="font-semibold text-slate-800">${user.gender || "Not disclosed"}</span></div>
              <div class="p-3 bg-slate-50 rounded-xl border border-slate-100"><span class="block text-[10px] uppercase font-bold text-slate-400">Age Metric</span><span class="font-semibold text-slate-800">${user.age || "Hidden"}</span></div>
            </div>
          </div>

          <div class="pt-4 flex flex-col sm:flex-row gap-3">
            ${isSelf ? `
              <button onclick="go('profile.html')" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white py-3.5 px-6 rounded-2xl font-bold transition shadow-md active:scale-[0.99]">
                Edit My Profile
              </button>
            ` : `
              <button id="followBtn" onclick="followUser()" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3.5 px-6 rounded-2xl font-bold transition shadow-md shadow-blue-100 active:scale-[0.99]">
                Loading Status...
              </button>
              <button onclick="startDirectChat()" class="bg-slate-800 hover:bg-slate-900 text-white py-3.5 px-6 rounded-2xl font-bold transition shadow-md active:scale-[0.99]">
                Message Profile
              </button>
            `}
          </div>
        `;

        if (!isSelf) {
          const isFollowing = user.followers && Array.isArray(user.followers) 
            ? user.followers.some(f => String(f._id || f.id || f) === currentUserId) 
            : false;

          updateFollowButtonUI(isFollowing);
        }

      } catch (err) {
        console.error("❌ PROFILE SYSTEM LOADING FAULT:", err);
        container.innerHTML = `<div class="text-center text-red-500 font-bold p-4">Network pipeline dropped link to profiles.</div>`;
      }
    }

    function updateFollowButtonUI(isFollowing) {
      const btn = document.getElementById("followBtn");
      if (!btn) return;

      if (isFollowing) {
        btn.innerText = "🤝 Connected (Unfollow)";
        btn.className = "flex-1 bg-slate-200 hover:bg-slate-300 text-slate-700 py-3.5 px-6 rounded-2xl font-bold transition active:scale-[0.99]";
      } else {
        btn.innerText = "➕ Follow Network Node";
        btn.className = "flex-1 bg-blue-600 hover:bg-blue-700 text-white py-3.5 px-6 rounded-2xl font-bold transition shadow-md shadow-blue-100 active:scale-[0.99]";
      }
    }

    async function followUser() {
      const btn = document.getElementById("followBtn");
      if (btn) btn.disabled = true;

      try {
        let res = await fetch(`${API}/api/user/follow/${profileUserId}`, {
          method: "PUT",
          headers: getHeaders()
        });

        if (res.status === 404) {
          res = await fetch(`${API}/api/users/follow/${profileUserId}`, {
            method: "PUT",
            headers: getHeaders()
          });
        }

        const data = await res.json();

        if (!res.ok) {
          alert(data.message || "Mutation execution rejected by remote data engine.");
          return;
        }

        const isFollowing = data.following !== undefined 
          ? data.following 
          : (data.followers && data.followers.includes(currentUserId));

        updateFollowButtonUI(isFollowing);

      } catch (err) {
        console.error("❌ CRITICAL RELATION ENGINE ABORT:", err);
        alert("Server failed to commit follow updates.");
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    document.addEventListener("DOMContentLoaded", loadProfile);
  </script>

  <script src="chatBadge.js"></script>
</body>
</html>
